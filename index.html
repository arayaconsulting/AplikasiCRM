<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyalty CRM System - Araya Consulting</title>
    <style>
        :root {
            --primary-bg: #f0f2f5;
            --card-bg: #ffffff;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
        }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--primary-bg); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: auto; }
        
        /* Branding Area */
        .brand-section { text-align: center; margin-bottom: 30px; }
        .brand-section img { max-width: 150px; height: auto; margin-bottom: 10px; }
        .brand-section h1 { font-size: 1.1rem; text-transform: uppercase; letter-spacing: 2px; color: var(--text-main); margin: 0; }

        .card { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        .section-header { font-size: 0.8rem; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin: 20px 0 10px 0; display: flex; align-items: center; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #eee; margin-left: 10px; }

        label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 5px; color: #555; }
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border: 1.5px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 1rem; transition: 0.3s; }
        input:focus { border-color: var(--accent-color); outline: none; box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.1); }

        .btn { width: 100%; padding: 15px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; margin-bottom: 10px; }
        .btn-check { background: transparent; border: 2px solid var(--accent-color); color: var(--accent-color); }
        .btn-save { background: var(--success-color); color: white; box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2); }
        .btn-redeem { background: var(--text-main); color: white; }
        .btn:active { transform: scale(0.97); }

        .result-box { margin-top: 20px; padding: 15px; border-radius: 12px; display: none; font-size: 0.95rem; line-height: 1.6; animation: slideUp 0.3s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .footer { text-align: center; margin-top: 40px; font-size: 0.75rem; color: var(--text-muted); border-top: 1px solid #ddd; padding-top: 20px; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-section">
        <img src="logo.png" alt="Araya Consulting Logo">
        <h1>Loyalty CRM System</h1>
    </div>

    <div class="card">
        <div class="section-header" style="margin-top:0;">Database Pelanggan</div>
        <label>Nomor WhatsApp</label>
        <input type="tel" id="phone" placeholder="Masukkan nomor HP aktif">
        <button class="btn btn-check" onclick="cekPoin()">Cek Status & Poin</button>

        <div class="section-header">Manajemen Poin</div>
        <label>Nama Pelanggan (Untuk User Baru)</label>
        <input type="text" id="name" placeholder="Nama Lengkap">
        <label>Total Belanja (Rp)</label>
        <input type="number" id="amount" placeholder="Contoh: 50000">
        <button class="btn btn-save" onclick="tambahPoin()">Input & Tambah Poin</button>

        <div class="section-header">Katalog Reward</div>
        <label>Pilih Hadiah</label>
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="20">Dimsum (20 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn btn-redeem" onclick="redeemPoin()">Tukarkan Sekarang</button>

        <div id="output" class="result-box"></div>
    </div>

    <div class="footer">
        Powered by <strong>Araya Consulting</strong><br>
        Sistem Manajemen Loyalitas Digital &copy; 2026
    </div>
</div>

<script>
    const STORAGE_KEY = 'arayacrm_data';
    
    function getDb() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    function saveDb(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function showOutput(msg, type) {
        const out = document.getElementById('output');
        out.style.display = 'block';
        
        if(type === 'success') {
            out.style.background = '#e8f5e9';
            out.style.color = '#2e7d32';
            out.style.borderLeft = '5px solid #27ae60';
        } else if(type === 'info') {
            out.style.background = '#e3f2fd';
            out.style.color = '#1565c0';
            out.style.borderLeft = '5px solid #3498db';
        } else {
            out.style.background = '#ffebee';
            out.style.color = '#c62828';
            out.style.borderLeft = '5px solid #e74c3c';
        }
        out.innerHTML = msg;
    }

    function cekPoin() {
        const phone = document.getElementById('phone').value;
        const db = getDb();
        if (!phone) return alert("Masukkan nomor WhatsApp pelanggan!");
        
        if (db[phone]) {
            showOutput(`<strong>Status: Member Aktif</strong><br>Nama: ${db[phone].name}<br>Saldo: <strong>${db[phone].points} Poin</strong>`, 'info');
        } else {
            showOutput("Nomor belum terdaftar. Silakan isi Nama & Nominal untuk pendaftaran baru.", 'error');
        }
    }

    function tambahPoin() {
        const phone = document.getElementById('phone').value;
        let nameInput = document.getElementById('name').value;
        const amount = parseInt(document.getElementById('amount').value);
        
        if (!phone || isNaN(amount) || amount < 10000) {
            return alert("Lengkapi nomor HP dan minimal belanja Rp10.000");
        }

        // Ketentuan 10.000 = 1 Poin
        const poinBaru = Math.floor(amount / 10000);
        let db = getDb();

        if (db[phone]) {
            db[phone].points += poinBaru;
        } else {
            db[phone] = { 
                name: nameInput || "Member", 
                points: poinBaru 
            };
        }

        saveDb(db);
        showOutput(`<strong>Transaksi Berhasil!</strong><br>Pelanggan: ${db[phone].name}<br>Poin Baru: +${poinBaru}<br>Total Saldo: <strong>${db[phone].points} Pts</strong>`, 'success');
        document.getElementById('amount').value = "";
    }

    function redeemPoin() {
        const phone = document.getElementById('phone').value;
        const select = document.getElementById('reward');
        const cost = parseInt(select.value);
        const rewardName = select.options[select.selectedIndex].text;
        
        let db = getDb();

        if (!db[phone]) return alert("Data pelanggan tidak ditemukan!");
        if (db[phone].points < cost) return alert("Poin tidak cukup untuk menukarkan " + rewardName);

        db[phone].points -= cost;
        saveDb(db);
        showOutput(`<strong>Redeem Sukses!</strong><br>Hadiah: ${rewardName}<br>Sisa Poin ${db[phone].name}: <strong>${db[phone].points} Pts</strong>`, 'success');
    }
</script>

</body>
</html>

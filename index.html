<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seblak Salah CRM - Modern Edition</title>
    <style>
        :root {
            --primary: #e67e22;
            --secondary: #2c3e50;
            --success: #27ae60;
            --wa: #25d366;
            --danger: #e74c3c;
            --bg: #f8f9fa;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg);
            background-image: radial-gradient(circle at top right, rgba(230, 126, 34, 0.05), transparent),
                              radial-gradient(circle at bottom left, rgba(44, 62, 80, 0.05), transparent);
            margin: 0;
            padding: 20px;
            color: var(--secondary);
        }

        .container { max-width: 500px; margin: auto; }

        .header {
            text-align: center;
            padding: 20px 0 30px;
        }

        .header img {
            width: 120px;
            height: auto;
            filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
            margin-bottom: 10px;
        }

        .header h1 {
            margin: 0;
            font-size: 1.8rem;
            letter-spacing: -1px;
            color: var(--primary);
            font-weight: 800;
        }

        .header p {
            margin: 5px 0 0;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #95a5a6;
            font-weight: 700;
        }

        .card {
            background: var(--card-bg);
            border-radius: 30px;
            padding: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
            margin-bottom: 25px;
            transition: transform 0.3s ease;
        }

        .section-title {
            font-size: 0.75rem;
            font-weight: 800;
            color: #bdc3c7;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
        }

        .section-title::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #f1f1f1;
            margin-left: 15px;
        }

        .input-group { margin-bottom: 18px; position: relative; }

        label {
            display: block;
            font-size: 0.75rem;
            font-weight: 700;
            margin-bottom: 8px;
            margin-left: 12px;
            color: #7f8c8d;
        }

        input, select {
            width: 100%;
            padding: 15px 18px;
            border-radius: 18px;
            border: 2px solid #f1f5f9;
            background: #f8fafc;
            font-size: 1rem;
            font-weight: 600;
            color: var(--secondary);
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--primary);
            background: #fff;
            box-shadow: 0 0 0 5px rgba(230, 126, 34, 0.1);
        }

        .status-badge {
            text-align: right;
            font-size: 0.8rem;
            font-weight: 800;
            color: var(--primary);
            margin-top: -10px;
            margin-bottom: 15px;
            min-height: 1.2rem;
        }

        .btn {
            width: 100%;
            padding: 18px;
            border: none;
            border-radius: 20px;
            font-size: 1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 12px;
        }

        .btn:active { transform: scale(0.98); }

        .btn-save {
            background: linear-gradient(135deg, #27ae60, #2ecc71);
            color: white;
            box-shadow: 0 8px 20px rgba(39, 174, 96, 0.2);
        }

        .btn-wa {
            background: #25d366;
            color: white;
            display: none;
            box-shadow: 0 8px 20px rgba(37, 211, 102, 0.2);
        }

        .btn-redeem {
            background: var(--secondary);
            color: white;
        }

        .info-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 20px;
            background: #fdfdfd;
            border: 1px solid #f1f5f9;
            border-radius: 18px;
            margin-bottom: 10px;
        }

        .info-name { font-weight: 700; font-size: 0.9rem; }
        .info-tag { font-size: 0.7rem; color: #95a5a6; font-weight: 600; }

        .btn-action {
            padding: 8px 15px;
            border-radius: 12px;
            font-size: 0.75rem;
            font-weight: 700;
            border: none;
            cursor: pointer;
        }

        #output {
            display: none;
            padding: 20px;
            border-radius: 20px;
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: 600;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <img src="logo.png" alt="Araya Consulting">
        <h1>Seblak Salah</h1>
        <p>Loyalty Management</p>
    </div>

    <div class="card">
        <div class="section-title">📍 Operasional</div>
        <div class="input-group">
            <select id="branch">
                <option value="Cabang Pahlawan">📍 Cabang Pahlawan</option>
                <option value="Cabang Mondokan">📍 Cabang Mondokan</option>
                <option value="Mitra Merakurak">🤝 Mitra Merakurak</option>
                <option value="Mitra Jenu">🤝 Mitra Jenu</option>
            </select>
        </div>

        <div class="section-title">👤 Data Pelanggan</div>
        <div class="input-group">
            <input type="tel" id="phone" placeholder="Nomor WA (Contoh: 0812...)" onblur="cekDatabase()">
        </div>
        <div id="statusCloud" class="status-badge"></div>
        
        <div class="input-group">
            <label>Nama Lengkap</label>
            <input type="text" id="name" placeholder="Masukkan nama...">
        </div>
        
        <div class="input-group">
            <label>Tanggal Lahir</label>
            <input type="date" id="dob">
        </div>

        <div class="input-group">
            <label>Nominal Belanja</label>
            <input type="number" id="amount" placeholder="Rp 0">
        </div>

        <button class="btn btn-save" onclick="prosesSimpan()">✨ Simpan Transaksi</button>
        <button id="btnWA" class="btn btn-wa" onclick="kirimSapaan()">💬 Kirim Sapaan WA</button>
        
        <div class="section-title">🎁 Penukaran Reward</div>
        <div class="input-group">
            <select id="reward">
                <option value="10">Es Teh Manis (10 Pts)</option>
                <option value="20">Dimsum (20 Pts)</option>
                <option value="25">Seblak Lengkap (25 Pts)</option>
            </select>
        </div>
        <button class="btn btn-redeem" onclick="prosesRedeem()">🎉 Tukarkan Poin</button>
        
        <div id="output"></div>
    </div>

    <div class="card">
        <div class="section-title">📢 Notifikasi CRM</div>
        <div id="listUltah"></div>
        <div id="listRindu"></div>
    </div>
</div>

<script>
    // URL SPREADSHEET TERBARU PAK ALI
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbz7B7z1jan2sT3dJV16H-pNPVjXE_A-F09RQzGq8z7htRKCLKxJtEj2X6aAa3w2jub9NQ/exec"; 
    const DB_KEY = "seblak_modern_db_v4";
    let activeUser = null;

    function getLocalDb() { return JSON.parse(localStorage.getItem(DB_KEY)) || {}; }
    function setLocalDb(data) { localStorage.setItem(DB_KEY, JSON.stringify(data)); refreshDashboards(); }

    async function cekDatabase() {
        const phone = document.getElementById('phone').value.trim();
        if(!phone) return;
        document.getElementById('statusCloud').innerText = "🔎 Mencari data...";
        try {
            const res = await fetch(`${APPS_SCRIPT_URL}?phone=${phone}`);
            const data = await res.json();
            if(!data.error) {
                document.getElementById('name').value = data.name;
                if(data.dob) document.getElementById('dob').value = data.dob.split('T')[0];
                document.getElementById('statusCloud').innerText = `Saldo: ${data.points} Pts | Sisa: Rp${data.sisaUang}`;
                activeUser = { phone, ...data };
                let db = getLocalDb(); db[phone] = activeUser; setLocalDb(db);
            } else {
                document.getElementById('statusCloud').innerText = "🆕 Pelanggan Baru";
                activeUser = null;
            }
        } catch(e) { document.getElementById('statusCloud').innerText = "⚠️ Cloud Offline"; }
    }

    function prosesSimpan() {
        const phone = document.getElementById('phone').value.trim();
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const amount = parseInt(document.getElementById('amount').value || 0);
        const branch = document.getElementById('branch').value;
        if(!phone || !name) return alert("Nomor WA dan Nama harus diisi!");

        let curPts = activeUser ? parseInt(activeUser.points) : 0;
        let curSisa = activeUser ? parseInt(activeUser.sisaUang) : 0;
        let total = curSisa + amount;
        let ptsBaru = curPts + Math.floor(total / 10000);
        let sisaBaru = total % 10000;

        activeUser = { phone, name, dob, points: ptsBaru, sisaUang: sisaBaru, branch, lastVisit: new Date().toISOString() };
        fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(activeUser) });
        
        let db = getLocalDb(); db[phone] = activeUser; setLocalDb(db);
        document.getElementById('statusCloud').innerText = `Saldo: ${ptsBaru} Pts | Sisa: Rp${sisaBaru}`;
        document.getElementById('btnWA').style.display = "flex";
        
        const out = document.getElementById('output');
        out.style.display = "block";
        out.style.background = "#ebfbee";
        out.style.color = "#27ae60";
        out.innerText = "✅ Transaksi Berhasil Disimpan!";
        document.getElementById('amount').value = "";
    }

    function kirimSapaan() {
        const pts = activeUser.points;
        const info = pts >= 10 ? `\n🔥 *Hore!* Poin Kakak sudah bisa ditukar dengan menu favorit gratis!\n` : `\n`;
        const pesan = `Halo Kak ${activeUser.name}! 👋\n\nTerima kasih sudah mampir ke *Seblak Salah*. 😊\n\nSaldo Poin: *${pts} Poin*\nTabungan Sisa: *Rp${activeUser.sisaUang}*${info}*Katalog Penukaran Poin:* \n🍹 10 Pts: Es Teh \n🥟 20 Pts: Dimsum \n🍲 25 Pts: Seblak Lengkap\n\nDitunggu kedatangannya lagi ya kak!`;
        window.open(`https://wa.me/${activeUser.phone.replace(/^0/,'62')}?text=${encodeURIComponent(pesan)}`);
    }

    function refreshDashboards() {
        const db = getLocalDb();
        const lUltah = document.getElementById('listUltah');
        const lRindu = document.getElementById('listRindu');
        lUltah.innerHTML = ""; lRindu.innerHTML = "";
        const today = new Date();
        const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);

        for (let k in db) {
            const u = db[k];
            if(u.dob) {
                const d = new Date(u.dob);
                if((d.getDate() == today.getDate() && d.getMonth() == today.getMonth()) || (d.getDate() == tomorrow.getDate() && d.getMonth() == tomorrow.getMonth())) {
                    const msgU = `Halo Kak ${u.name}! 👋\n\nKami dari *Seblak Salah* ingin mengucapkan *Selamat Ulang Tahun*! 🎂✨\n\nSemoga panjang umur, sehat selalu, dan dilancarkan rezekinya. Sebagai kado spesial, Seblak Salah mau *MENTRAKTIR* Kakak 1 Porsi SEBLAK LENGKAP gratis! 😍`;
                    lUltah.innerHTML += `<div class="info-row"><div><div class="info-name">🎉 ${u.name}</div><div class="info-tag">Ulang Tahun</div></div><button class="btn-action" style="background:var(--wa); color:white;" onclick="window.open('https://wa.me/${u.phone.replace(/^0/,'62')}?text=${encodeURIComponent(msgU)}')">Kado WA</button></div>`;
                }
            }
            if(u.lastVisit) {
                const diff = Math.floor((today - new Date(u.lastVisit)) / (1000*60*60*24));
                if(diff >= 10) {
                    const msgR = `Selamat Siang, apa kabarnya Kak ${u.name}? 👋\n\nSemoga Kakak sehat dan bahagia selalu ya. Di *Seblak Salah*, kami tiba-tiba teringat Kakak karena sudah ${diff} hari Kakak tidak mampir ke sini. ✨\n\nYuk, sempatkan mampir lagi. Kami tunggu ya Kak!`;
                    lRindu.innerHTML += `<div class="info-row"><div><div class="info-name">😢 ${u.name}</div><div class="info-tag">${diff} Hari Tidak Mampir</div></div><button class="btn-action" style="background:var(--secondary); color:white;" onclick="window.open('https://wa.me/${u.phone.replace(/^0/,'62')}?text=${encodeURIComponent(msgR)}')">Sapa</button></div>`;
                }
            }
        }
    }

    function prosesRedeem() {
        const cost = parseInt(document.getElementById('reward').value);
        if(!activeUser || activeUser.points < cost) return alert("Poin tidak cukup!");
        activeUser.points -= cost;
        fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(activeUser) });
        let db = getLocalDb(); db[activeUser.phone] = activeUser; setLocalDb(db);
        document.getElementById('statusCloud').innerText = `✅ Sisa Saldo: ${activeUser.points} Pts`;
        alert("Poin Berhasil Ditukarkan!");
    }
    window.onload = refreshDashboards;
</script>

</body>
</html>

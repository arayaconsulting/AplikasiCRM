<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Seblak Salah</title>
    <style>
        body { font-family: sans-serif; background: #f4f4f4; padding: 20px; text-align: center; }
        .card { background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); max-width: 350px; margin: auto; }
        input, button, select { width: 100%; padding: 12px; margin: 8px 0; border-radius: 8px; border: 1px solid #ddd; box-sizing: border-box; }
        button { background: #e67e22; color: white; border: none; font-weight: bold; cursor: pointer; }
        .footer { margin-top: 20px; font-size: 12px; color: #888; }
    </style>
</head>
<body>
    <div class="card">
        <h3>Seblak Salah</h3>
        <input type="text" id="phone" placeholder="Nomor WA">
        <button onclick="cek()">Cek Poin</button>
        <hr>
        <input type="number" id="amt" placeholder="Nominal Belanja">
        <button style="background: #27ae60;" onclick="tambah()">Tambah Poin</button>
        <div id="msg" style="margin-top:15px; font-weight:bold; color:#d35400;"></div>
        
        <div class="footer">
            <p>Developed by</p>
            <strong>ARAYA CONSULTING</strong>
        </div>
    </div>

    <script>
        function db() { return JSON.parse(localStorage.getItem('crm_seblak')) || {}; }
        function cek() {
            let p = document.getElementById('phone').value;
            let data = db();
            document.getElementById('msg').innerHTML = data[p] ? "Poin: " + data[p].pts : "Belum terdaftar";
        }
        function tambah() {
            let p = document.getElementById('phone').value;
            let a = parseInt(document.getElementById('amt').value);
            if(!p || !a) return alert("Isi data!");
            let data = db();
            let pts = Math.floor(a/10000);
            if(data[p]) data[p].pts += pts;
            else data[p] = {pts: pts};
            localStorage.setItem('crm_seblak', JSON.stringify(data));
            document.getElementById('msg').innerHTML = "Berhasil! Total Poin: " + data[p].pts;
        }
    </script>
</body>
</html>

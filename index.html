<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Seblak Salah - Powered by Araya Consulting</title>
    <style>
        :root { --primary: #e67e22; --secondary: #2c3e50; --success: #27ae60; --wa: #25d366; --birthday: #3498db; --bg: #f4f7f6; --card: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; line-height: 1.6; }
        .container { max-width: 500px; margin: auto; }
        .branding { text-align: center; margin-bottom: 25px; }
        .branding img { width: 140px; height: auto; margin-bottom: 10px; filter: drop-shadow(0 4px 6px rgba(0,0,0,0.1)); }
        .branding h1 { font-size: 1.8rem; color: var(--primary); margin: 0; font-weight: 800; letter-spacing: -0.5px; }
        .branding p { font-size: 0.75rem; color: #7f8c8d; margin: 2px 0; text-transform: uppercase; letter-spacing: 2px; font-weight: 700; }
        .card { background: var(--card); padding: 25px; border-radius: 28px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); border: 1px solid rgba(255,255,255,0.7); margin-bottom: 20px; }
        .section-header { font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 25px 0 12px 0; display: flex; align-items: center; letter-spacing: 1px; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: linear-gradient(to right, #e2e8f0, transparent); margin-left: 12px; }
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #f1f5f9; border-radius: 16px; box-sizing: border-box; font-size: 1rem; background: #f8fafc; transition: 0.3s; font-weight: 500; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; box-shadow: 0 0 0 4px rgba(230, 126, 34, 0.1); }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 18px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; margin-bottom: 12px; font-size: 1rem; }
        .btn-save { background: var(--success); color: white; box-shadow: 0 8px 20px rgba(39, 174, 96, 0.2); }
        .btn-wa { background: var(--wa); color: white; display: none; box-shadow: 0 8px 20px rgba(37, 211, 102, 0.2); }
        .status-cloud { font-size: 0.75rem; color: #64748b; text-align: right; margin-top: -10px; margin-bottom: 15px; font-weight: 600; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 15px; border-radius: 20px; margin-bottom: 10px; border: 1px solid #edf2f7; background: #fff; box-shadow: 0 4px 6px rgba(0,0,0,0.02); }
        .follow-up { background: #fffaf5; border-color: #ffe0b2; }
        .birthday-row { background: #f0f9ff; border-color: #bae6fd; }
        #branch { border: 2px solid var(--primary); background: #fffcf9; color: var(--primary); font-weight: 800; }
        #output { display:none; padding:18px; border-radius:20px; margin-top:15px; font-size:0.95rem; border-left: 6px solid var(--success); background: #f0fdf4; font-weight: 500; }
    </style>
</head>
<body>
<div class="container">
    <div class="branding">
        <img src="logo.png" alt="Araya Consulting">
        <h1>Seblak Salah</h1>
        <p>Loyalty Program Management</p>
    </div>

    <div class="card">
        <div class="section-header" style="margin-top:0;">Lokasi Cabang</div>
        <select id="branch">
            <option value="Cabang Pahlawan">📍 Cabang Pahlawan</option>
            <option value="Cabang Mondokan">📍 Cabang Mondokan</option>
            <option value="Mitra Merakurak">🤝 Mitra Merakurak</option>
            <option value="Mitra Jenu">🤝 Mitra Jenu</option>
        </select>

        <div class="section-header">Input Transaksi</div>
        <input type="tel" id="phone" placeholder="Ketik Nomor WA (08...)" onblur="cekDataCloud()">
        <div id="statusCloud" class="status-cloud"></div>
        <input type="text" id="name" placeholder="Nama Pelanggan">
        <input type="date" id="dob">
        <input type="number" id="amount" placeholder="Nominal Belanja (Rp)">
        
        <button class="btn btn-save" onclick="tambahPoin()">Simpan Transaksi</button>
        <button id="btnSapa" class="btn btn-wa" onclick="sapaPelanggan()">Kirim Sapaan (WA)</button>
        
        <div class="section-header">Redeem Reward</div>
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn" style="background:var(--secondary); color:white;" onclick="redeemPoin()">Tukarkan Poin</button>
        <div id="output"></div>
    </div>

    <div class="card">
        <div class="section-header" style="color:var(--birthday);">🎂 Pengingat Ulang Tahun (H-1)</div>
        <div id="listUltah"></div>
    </div>

    <div class="card">
        <div class="section-header">🚪 DASHBOARD FOLLOW-UP (≥ 10 Hari)</div>
        <div id="listFollowUp"></div>
    </div>
</div>

<script>
    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbxzBhTyx6w8yCVkqrrrIL374aHV4BDr1X4BHQOky3s_YCThu3MqpAZF1SBPnBBLvx57/exec"; 
    const STORAGE_KEY = 'seblaksalah_crm_v3';
    let lastActiveUser = null;

    function getDb() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    function saveDb(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); refreshDashboards(); }

    async function cekDataCloud() {
        const phone = document.getElementById('phone').value.trim();
        if (!phone) return;
        document.getElementById('statusCloud').innerHTML = "Memanggil database...";
        try {
            const response = await fetch(`${SPREADSHEET_URL}?phone=${phone}`);
            const data = await response.json();
            if (data && !data.error) {
                document.getElementById('name').value = data.name || "";
                if (data.dob) {
                    let d = data.dob.split('T')[0];
                    document.getElementById('dob').value = d;
                }
                document.getElementById('statusCloud').innerHTML = `✅ Saldo: ${data.points} Pts | Sisa: Rp${data.sisaUang || 0}`;
                document.getElementById('statusCloud').style.color = "#27ae60";
                let db = getDb();
                db[phone] = { ...data };
                saveDb(db);
            } else {
                document.getElementById('statusCloud').innerHTML = "ℹ️ Pelanggan Baru";
                document.getElementById('statusCloud').style.color = "#e67e22";
            }
        } catch (e) { document.getElementById('statusCloud').innerHTML = "⚠️ Gagal ambil data."; }
    }

    function tambahPoin() {
        const phone = document.getElementById('phone').value.trim();
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const branch = document.getElementById('branch').value;
        const amount = parseInt(document.getElementById('amount').value || 0);
        
        if (!phone) return alert("Isi nomor WA!");

        let db = getDb();
        let user = db[phone] || { points: 0, sisaUang: 0 };
        let totalUang = (parseInt(user.sisaUang) || 0) + amount;
        user.points = (parseInt(user.points) || 0) + Math.floor(totalUang / 10000);
        user.sisaUang = totalUang % 10000;
        user.name = name; 
        user.dob = dob; 
        user.lastVisit = new Date().toISOString();
        
        db[phone] = user;
        saveDb(db);
        
        fetch(SPREADSHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ phone, name, points: user.points, dob, amount, branch }) });

        lastActiveUser = { phone, ...user };
        document.getElementById('statusCloud').innerHTML = `✅ Saldo: ${user.points} Pts | Sisa: Rp${user.sisaUang}`;
        const out = document.getElementById('output');
        out.style.display = 'block';
        out.style.background = '#f0fdf4';
        out.innerHTML = `✅ <strong>Simpan Berhasil!</strong><br>Poin: ${user.points} | Lokasi: ${branch}`;
        document.getElementById('btnSapa').style.display = 'flex';
        document.getElementById('amount').value = "";
    }

    function sapaPelanggan() {
        if (!lastActiveUser) return;
        const pts = lastActiveUser.points;
        const sisa = lastActiveUser.sisaUang;
        let infoPoin = pts >= 10 ? `\n🔥 *Hore!* Poin Kakak sudah bisa ditukar dengan menu favorit gratis!\n` : `\n`;
        const katalog = `*Katalog Penukaran Poin:* \n🍹 10 Pts: Es Teh \n🍲 25 Pts: Seblak Lengkap`;
        const pesan = `Halo Kak ${lastActiveUser.name}! 👋\n\nTerima kasih sudah mampir ke *Seblak Salah*. 😊\n\nSaldo Poin: *${pts} Poin*\nTabungan Sisa: *Rp${sisa}*${infoPoin}${katalog}\n\nDitunggu kedatangannya lagi ya kak!`;
        window.open(`https://wa.me/${lastActiveUser.phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`, '_blank');
        document.getElementById('btnSapa').style.display = 'none';
    }

    function refreshDashboards() {
        const db = getDb();
        const listUltah = document.getElementById('listUltah');
        const listFollowUp = document.getElementById('listFollowUp');
        listUltah.innerHTML = ""; listFollowUp.innerHTML = "";
        const today = new Date();
        const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);

        for (let phone in db) {
            const user = db[phone];
            if (user.dob) {
                const bday = new Date(user.dob);
                const isToday = bday.getDate() === today.getDate() && bday.getMonth() === today.getMonth();
                const isTomorrow = bday.getDate() === tomorrow.getDate() && bday.getMonth() === tomorrow.getMonth();
                if (isToday || isTomorrow) {
                    const pesanUltah = `Halo Kak ${user.name}! 👋\n\nKami dari *Seblak Salah* ingin mengucapkan *Selamat Ulang Tahun*! 🎂✨\n\nSemoga panjang umur, sehat selalu, dan dilancarkan rezekinya. Sebagai kado spesial, Seblak Salah mau *MENTRAKTIR* Kakak 1 Porsi SEBLAK LENGKAP gratis! 😍\n\nSyaratnya cukup tunjukkan WA ini dan kartu identitas ke kasir. Khusus makan di tempat ya Kak. Ditunggu kedatangannya! 🍲✨`;
                    listUltah.innerHTML += `<div class="item-row birthday-row"><div><strong>${user.name}</strong><br><small>${isToday ? 'Hari Ini' : 'Besok'}</small></div><button class="btn" style="width:auto; padding:8px 15px; background:var(--wa); color:white; font-size:0.8rem; margin:0;" onclick="window.open('https://wa.me/${phone.replace(/^0/,'62')}?text=${encodeURIComponent(pesanUltah)}')">Traktir</button></div>`;
                }
            }
            if (user.lastVisit) {
                const diffDays = Math.ceil(Math.abs(today - new Date(user.lastVisit)) / (1000 * 60 * 60 * 24));
                if (diffDays >= 10) {
                    const pesanRindu = `Selamat Siang, apa kabarnya Kak ${user.name}? 👋\n\nSemoga Kakak sehat dan bahagia selalu ya. Di *Seblak Salah*, kami tiba-tiba teringat Kakak karena sudah ${diffDays} hari Kakak tidak mampir ke sini. ✨\n\nRasanya ada yang kurang kalau meja favorit Kakak kosong terlalu lama. Oh iya, Kakak masih punya tabungan *${user.points} Poin* loh, sayang banget kalau tidak dimanfaatkan. 😊\n\nYuk, sempatkan mampir lagi. Kami tunggu ya Kak untuk melepas rindu dengan aroma kencur dan pedas khas Seblak Salah! 🍲✨`;
                    listFollowUp.innerHTML += `<div class="item-row follow-up"><div><strong>${user.name}</strong><br><small>${diffDays} Hari Tidak Mampir</small></div><button class="btn" style="width:auto; padding:8px 15px; background:var(--secondary); color:white; font-size:0.8rem; margin:0;" onclick="window.open('https://wa.me/${phone.replace(/^0/,'62')}?text=${encodeURIComponent(pesanRindu)}')">Sapa</button></div>`;
                }
            }
        }
    }

    function redeemPoin() {
        const phone = document.getElementById('phone').value.trim();
        const cost = parseInt(document.getElementById('reward').value);
        const branch = document.getElementById('branch').value;
        let db = getDb();
        if (!db[phone] || db[phone].points < cost) return alert("Poin tidak cukup!");
        
        db[phone].points -= cost; 
        saveDb(db);
        document.getElementById('statusCloud').innerHTML = `✅ Saldo: ${db[phone].points} Pts | Sisa: Rp${db[phone].sisaUang}`;
        
        fetch(SPREADSHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ phone, name: db[phone].name, points: db[phone].points, dob: db[phone].dob, amount: 0, branch }) });
        
        const out = document.getElementById('output');
        out.style.display = 'block';
        out.style.background = '#fef2f2';
        out.style.borderLeftColor = '#ef4444';
        out.innerHTML = `🎁 <strong>Redeem Berhasil!</strong><br>Sisa: ${db[phone].points} Pts | Lokasi: ${branch}`;
    }

    window.onload = refreshDashboards;
</script>
</body>
</html>

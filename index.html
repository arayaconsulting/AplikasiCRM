<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Seblak Salah - Powered by Araya Consulting</title>
    <style>
        :root { --primary: #e67e22; --secondary: #2c3e50; --success: #27ae60; --wa: #25d366; --birthday: #3498db; --bg: #f4f7f6; --card: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: auto; }
        .branding { text-align: center; margin-bottom: 25px; }
        .branding img { width: 120px; height: auto; margin-bottom: 5px; display: block; margin-left: auto; margin-right: auto; border-radius: 10px; }
        .branding h1 { font-size: 1.6rem; color: var(--primary); margin: 0; font-weight: 800; }
        .branding p { font-size: 0.8rem; color: #7f8c8d; margin: 2px 0; text-transform: uppercase; letter-spacing: 1px; }
        .card { background: var(--card); padding: 20px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #edf2f7; margin-bottom: 15px; }
        .section-header { font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 20px 0 10px 0; display: flex; align-items: center; letter-spacing: 0.5px; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; margin-left: 10px; }
        label { font-size: 0.7rem; font-weight: 600; display: block; margin-bottom: 4px; color: #475569; margin-top: 10px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 5px; border: 2px solid #f1f5f9; border-radius: 12px; box-sizing: border-box; font-size: 0.95rem; background: #f8fafc; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 0.95rem; transition: 0.3s; margin-top: 15px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save { background: var(--success); color: white; }
        .btn-wa { background: var(--wa); color: white; }
        .btn-redeem { background: var(--secondary); color: white; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 15px; margin-bottom: 8px; border: 1px solid; }
        .follow-up { background: #fff5eb; border-color: #ffe0b2; }
        .birthday-row { background: #eef7ff; border-color: #cde4f7; }
        .info-text { font-size: 0.8rem; }
        .info-text strong { display: block; font-size: 0.9rem; color: var(--secondary); }
        .btn-mini-wa { padding: 6px 12px; background: var(--wa); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 15px; display: none; font-size: 0.9rem; border-left: 5px solid #27ae60; }
        .status-cloud { font-size: 0.7rem; color: #94a3b8; margin-bottom: 10px; text-align: right; font-weight: bold; min-height: 15px; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.7rem; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="branding">
        <img src="logo.png" alt="Logo Seblak Salah"> 
        <h1>Seblak Salah</h1>
        <p>LOYALTY PROGRAM MANAGEMENT</p>
    </div>

    <div class="card">
        <div class="section-header" style="margin-top:0;">DATA TRANSAKSI</div>
        
        <label>Nomor WhatsApp</label>
        <input type="tel" id="phone" placeholder="Contoh: 08123456789" onblur="cekDataCloud()">
        <div id="statusCloud" class="status-cloud"></div>
        
        <label>Nama Pelanggan</label>
        <input type="text" id="name" placeholder="Nama Lengkap">
        
        <label>Tanggal Lahir</label>
        <input type="date" id="dob">
        
        <label>Pilih Cabang / Mitra</label>
        <select id="branch">
            <option value="Cabang Pahlawan">Cabang Pahlawan</option>
            <option value="Cabang Mondokan">Cabang Mondokan</option>
            <option value="Mitra Merakurak">Mitra Merakurak</option>
            <option value="Mitra Jenu">Mitra Jenu</option>
        </select>

        <label>Nominal Belanja (Rp)</label>
        <input type="number" id="amount" placeholder="Contoh: 25000">
        
        <button id="btnSave" class="btn btn-save" onclick="tambahPoin()">💾 Simpan Transaksi</button>
        <button id="btnSapa" class="btn btn-wa" style="display: none;" onclick="sapaPelanggan()">💬 Kirim Sapaan (WA)</button>
        
        <div class="section-header">REDEEM REWARD</div>
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="20">Dimsum (20 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn btn-redeem" onclick="redeemPoin()">🎁 Tukarkan Poin</button>
        <div id="output" class="result-box"></div>
    </div>

    <div class="card">
        <div class="section-header" style="color: var(--birthday);">🎂 ULANG TAHUN (H-1)</div>
        <div id="listUltah"></div>
    </div>

    <div class="card">
        <div class="section-header">🚪 FOLLOW-UP (≥ 10 HARI)</div>
        <div id="listFollowUp"></div>
    </div>

    <div class="footer">Developed by <strong>Araya Consulting</strong> &copy; 2026</div>
</div>

<script>
    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbLzqYz56ANEfQCXbk4aNK0L3-1Jo39oLLS8d-uGq0C-llYaNIzh2vFc4f5Eq433EU4/exec"; 
    const STORAGE_KEY = 'seblaksalah_crm_v4';
    let lastActiveUser = null;

    function getDb() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    function saveDb(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); refreshDashboards(); }

    function updateStatusUI(pts, sisa) {
        const statusEl = document.getElementById('statusCloud');
        statusEl.innerHTML = `✅ Saldo: ${pts} Pts | Tabungan: Rp${sisa}`;
        statusEl.style.color = "#27ae60";
    }

    async function cekDataCloud() {
        const phone = document.getElementById('phone').value;
        if (!phone) return;
        const statusEl = document.getElementById('statusCloud');
        statusEl.innerHTML = "⏳ Mengecek data...";
        
        try {
            const response = await fetch(`${SPREADSHEET_URL}?phone=${phone}`);
            const data = await response.json();
            if (data && !data.error) {
                document.getElementById('name').value = data.name || "";
                if (data.dob) document.getElementById('dob').value = data.dob;
                if (data.branch) document.getElementById('branch').value = data.branch;
                
                let db = getDb();
                db[phone] = { 
                    name: data.name, 
                    points: data.points, 
                    lastVisit: data.lastVisit, 
                    dob: data.dob, 
                    sisaUang: data.sisaUang || 0,
                    branch: data.branch || "Cabang Pahlawan"
                };
                saveDb(db);
                updateStatusUI(data.points, data.sisaUang);
            } else { 
                statusEl.innerHTML = "✨ Pelanggan Baru"; 
                statusEl.style.color = "#e67e22"; 
            }
        } catch (e) { 
            statusEl.innerHTML = "⚠️ Cloud Offline"; 
            statusEl.style.color = "#e74c3c";
        }
    }

    function tambahPoin() {
        const phone = document.getElementById('phone').value;
        const nameInput = document.getElementById('name').value;
        const dobInput = document.getElementById('dob').value;
        const branchInput = document.getElementById('branch').value;
        const amount = parseInt(document.getElementById('amount').value || 0);
        
        if (!phone) return alert("Nomor WA harus diisi!");
        
        let db = getDb();
        const now = new Date().toISOString();
        let currentSisa = db[phone] ? (parseInt(db[phone].sisaUang) || 0) : 0;
        let totalUang = currentSisa + amount;
        let poinBaru = Math.floor(totalUang / 10000);
        let sisaBaru = totalUang % 10000;

        if (db[phone]) {
            db[phone].points = (parseInt(db[phone].points) || 0) + poinBaru; 
            db[phone].sisaUang = sisaBaru; 
            db[phone].lastVisit = now;
            db[phone].branch = branchInput;
            if(nameInput) db[phone].name = nameInput; 
            if(dobInput) db[phone].dob = dobInput;
        } else { 
            db[phone] = { 
                name: nameInput || "Pelanggan", 
                points: poinBaru, 
                lastVisit: now, 
                dob: dobInput || "", 
                sisaUang: sisaBaru,
                branch: branchInput
            }; 
        }
        
        saveDb(db);
        
        fetch(SPREADSHEET_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ 
                phone, 
                name: db[phone].name, 
                points: db[phone].points, 
                dob: db[phone].dob, 
                amount,
                branch: branchInput 
            }) 
        });

        lastActiveUser = { phone, ...db[phone] };
        updateStatusUI(db[phone].points, db[phone].sisaUang);
        
        const out = document.getElementById('output');
        out.style.display = 'block';
        out.innerHTML = `✅ <strong>Transaksi Berhasil!</strong><br>Poin: ${db[phone].points} | Sisa: Rp${db[phone].sisaUang}<br>Cabang: ${branchInput}`;
        
        document.getElementById('btnSapa').style.display = 'flex';
        document.getElementById('amount').value = "";
    }

    function sapaPelanggan() {
        if (!lastActiveUser) return;
        const pts = lastActiveUser.points;
        const sisa = lastActiveUser.sisaUang;
        const cabang = lastActiveUser.branch;
        
        let infoPoin = pts >= 10 ? `\n🔥 *Hore!* Poin Kakak sudah bisa ditukar dengan menu favorit gratis!\n` : `\n`;
        const katalog = `*Katalog Penukaran Poin:* \n🍹 10 Pts: Es Teh \n🥟 20 Pts: Dimsum \n🍲 25 Pts: Seblak Lengkap`;
        
        const pesan = `Halo Kak ${lastActiveUser.name}! 👋\n\nTerima kasih sudah mampir ke *Seblak Salah (${cabang})*. 😊\n\nSaldo Poin: *${pts} Poin*\nTabungan Sisa: *Rp${sisa}*${infoPoin}\n${katalog}\n\n_Kumpulkan terus poinnya dan nikmati reward spesial dari kami!_\n\nDitunggu kedatangannya lagi ya kak!`;
        
        window.open(`https://wa.me/${lastActiveUser.phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`, '_blank');
        document.getElementById('btnSapa').style.display = 'none';
    }

    function getSapaanWaktu() {
        const jam = new Date().getHours();
        if (jam < 11) return "Selamat Pagi";
        if (jam < 15) return "Selamat Siang";
        if (jam < 18) return "Selamat Sore";
        return "Selamat Malam";
    }

    function kirimUltah(phone, nama) {
        const pesan = `Halo Kak ${nama}! 👋\n\nKami dari *Seblak Salah* ingin mengucapkan *Selamat Ulang Tahun*! 🎂✨\n\nSemoga panjang umur, sehat selalu, dan dilancarkan rezekinya. Sebagai kado spesial, Seblak Salah mau *MENTRAKTIR* Kakak 1 Porsi SEBLAK LENGKAP gratis! 😍\n\nSyaratnya cukup tunjukkan WA ini dan kartu identitas ke kasir. Khusus makan di tempat ya Kak. Ditunggu kedatangannya! 🍲✨`;
        window.open(`https://wa.me/${phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    function kirimRindu(phone, nama, poin, hari) {
        const sapaanWaktu = getSapaanWaktu();
        const pesan = `${sapaanWaktu}, apa kabarnya Kak ${nama}? 👋\n\nSemoga Kakak sehat dan bahagia selalu ya. Di *Seblak Salah*, kami tiba-tiba teringat Kakak karena sudah ${hari} hari Kakak tidak mampir ke sini. ✨\n\nRasanya ada yang kurang kalau meja favorit Kakak kosong terlalu lama. Oh iya, Kakak masih punya tabungan *${poin} Poin* loh, sayang banget kalau tidak dimanfaatkan. 😊\n\nYuk, sempatkan mampir lagi. Kami tunggu ya Kak untuk melepas rindu dengan aroma kencur dan pedas khas Seblak Salah! 🍲✨`;
        window.open(`https://wa.me/${phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    function refreshDashboards() {
        const db = getDb();
        const listUltah = document.getElementById('listUltah');
        const listFollowUp = document.getElementById('listFollowUp');
        listUltah.innerHTML = ""; listFollowUp.innerHTML = "";
        
        const today = new Date();
        const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);

        for (let phone in db) {
            if (db[phone].dob) {
                const bday = new Date(db[phone].dob);
                const isToday = bday.getDate() === today.getDate() && bday.getMonth() === today.getMonth();
                const isTomorrow = bday.getDate() === tomorrow.getDate() && bday.getMonth() === tomorrow.getMonth();
                if (isToday || isTomorrow) {
                    const row = document.createElement('div'); row.className = 'item-row birthday-row';
                    row.innerHTML = `<div class="info-text"><strong>${db[phone].name}</strong>Ultah: ${isToday ? "HARI INI!" : "Besok"}</div><button class="btn-mini-wa" onclick="kirimUltah('${phone}', '${db[phone].name}')">Traktir</button>`;
                    listUltah.appendChild(row);
                }
            }
            
            const visitDate = db[phone].lastVisit ? new Date(db[phone].lastVisit) : null;
            if (visitDate) {
                const diffDays = Math.ceil(Math.abs(today - visitDate) / (1000 * 60 * 60 * 24));
                if (diffDays >= 10) {
                    const row = document.createElement('div'); row.className = 'item-row follow-up';
                    row.innerHTML = `<div class="info-text"><strong>${db[phone].name}</strong>${diffDays} hari tidak mampir</div><button class="btn-mini-wa" onclick="kirimRindu('${phone}', '${db[phone].name}', ${db[phone].points}, ${diffDays})">Sapa</button>`;
                    listFollowUp.appendChild(row);
                }
            }
        }
    }

    function redeemPoin() {
        const phone = document.getElementById('phone').value;
        const cost = parseInt(document.getElementById('reward').value);
        let db = getDb();
        if (!db[phone] || db[phone].points < cost) return alert("Poin tidak cukup!");
        
        db[phone].points -= cost; 
        db[phone].lastVisit = new Date().toISOString();
        saveDb(db);
        updateStatusUI(db[phone].points, db[phone].sisaUang);
        
        fetch(SPREADSHEET_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ 
                phone, 
                name: db[phone].name, 
                points: db[phone].points, 
                dob: db[phone].dob, 
                amount: 0,
                branch: db[phone].branch 
            }) 
        });
        
        const out = document.getElementById('output');
        out.style.display = 'block'; out.style.background = '#fef2f2'; out.style.borderLeftColor = '#e74c3c';
        out.innerHTML = `🎁 <strong>Redeem Berhasil!</strong><br>Sisa Poin: ${db[phone].points}`;
    }

    window.onload = refreshDashboards;
</script>
</body>
</html>

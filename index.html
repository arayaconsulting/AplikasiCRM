<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seblak Salah CRM - Lancar Jaya</title>
    <style>
        :root { --p: #e67e22; --s: #2c3e50; --g: #27ae60; --w: #25d366; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); margin: 0; padding: 10px; font-size: 13px; }
        .container { max-width: 450px; margin: auto; }
        .card { background: white; padding: 12px; border-radius: 18px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); margin-bottom: 10px; }
        .header { text-align: center; padding: 5px 0; }
        .header img { width: 90px; height: auto; margin-bottom: 5px; }
        .header h1 { margin: 0; font-size: 1.3rem; color: var(--p); font-weight: 800; }
        .section-title { font-size: 0.65rem; font-weight: 800; color: #bdc3c7; text-transform: uppercase; margin: 8px 0; display: flex; align-items: center; }
        .section-title::after { content: ""; flex: 1; height: 1px; background: #eee; margin-left: 10px; }
        input, select { width: 100%; padding: 10px; border-radius: 12px; border: 2px solid #f1f5f9; background: #f8fafc; font-size: 0.9rem; font-weight: 600; box-sizing: border-box; margin-bottom: 5px; }
        label { font-size: 0.65rem; font-weight: 700; color: #7f8c8d; margin-left: 5px; }
        .status-badge { text-align: right; font-size: 0.75rem; font-weight: 800; color: var(--p); margin-top: -4px; margin-bottom: 8px; min-height: 1rem; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-weight: 700; cursor: pointer; margin-bottom: 5px; font-size: 0.9rem; }
        .btn-save { background: var(--g); color: white; }
        .btn-wa { background: var(--w); color: white; display: none; }
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 8px; background: #fdfdfd; border: 1px solid #f1f5f9; border-radius: 12px; margin-bottom: 5px; font-size: 0.85rem; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <img src="logo.png" alt="Logo">
        <h1>Seblak Salah</h1>
    </div>

    <div class="card">
        <label>📍 Cabang Operasional</label>
        <select id="branch">
            <option value="Cabang Pahlawan">Cabang Pahlawan</option>
            <option value="Cabang Mondokan">Cabang Mondokan</option>
            <option value="Mitra Merakurak">Mitra Merakurak</option>
            <option value="Mitra Jenu">Mitra Jenu</option>
        </select>

        <div class="section-title">Data Pelanggan</div>
        <input type="tel" id="phone" placeholder="Nomor WA (08...)" onblur="cekDatabase()">
        <div id="statusCloud" class="status-badge"></div>
        
        <input type="text" id="name" placeholder="Nama Pelanggan">
        <label>Tanggal Lahir</label>
        <input type="date" id="dob">
        <input type="number" id="amount" placeholder="Nominal Belanja (Rp)">
        
        <button class="btn btn-save" onclick="prosesSimpan()">Simpan Transaksi</button>
        <button id="btnWA" class="btn btn-wa" onclick="kirimSapaan()">💬 Kirim Sapaan WA</button>
        
        <div class="section-title">Redeem Poin</div>
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="20">Dimsum (20 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn" style="background:var(--s); color:white;" onclick="prosesRedeem()">Tukarkan Poin</button>
    </div>

    <div class="card">
        <div class="section-title" style="color:#3498db;">📢 Notifikasi CRM (Auto-Refresh)</div>
        <div id="listDash"></div>
    </div>
</div>

<script>
    const URL_SCRIPT = "https://script.google.com/macros/s/AKfycbxPVZCYPzVIZCF50aNSt7snGFVKM2D7sCv5sFIeMLA905W6o88adFbYZh_Ev8HPHo6R/exec"; 
    const DB_KEY = "seblak_compact_v8_final";
    let activeUser = null;

    function getLocalDb() { return JSON.parse(localStorage.getItem(DB_KEY)) || {}; }
    function setLocalDb(data) { localStorage.setItem(DB_KEY, JSON.stringify(data)); refreshDashboards(); }

    async function cekDatabase() {
        const phone = document.getElementById('phone').value.trim();
        if(!phone) return;
        document.getElementById('statusCloud').innerText = "🔎 Mencari...";
        try {
            const res = await fetch(`${URL_SCRIPT}?phone=${phone}`);
            const data = await res.json();
            if(!data.error) {
                document.getElementById('name').value = data.name;
                if(data.dob) document.getElementById('dob').value = data.dob;
                document.getElementById('statusCloud').innerText = `✅ Saldo: ${data.points} Pts | Sisa: Rp${data.sisaUang}`;
                activeUser = { phone, ...data };
                let db = getLocalDb(); db[phone] = activeUser; setLocalDb(db);
            } else {
                document.getElementById('statusCloud').innerText = "🆕 Pelanggan Baru";
                activeUser = null;
            }
        } catch(e) { document.getElementById('statusCloud').innerText = "✅ Cloud Terhubung"; }
    }

    function prosesSimpan() {
        const phone = document.getElementById('phone').value.trim();
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const amount = parseInt(document.getElementById('amount').value || 0);
        const branch = document.getElementById('branch').value;
        if(!phone || !name) return alert("WA & Nama wajib!");

        let curPts = activeUser ? parseInt(activeUser.points) : 0;
        let curSisa = activeUser ? parseInt(activeUser.sisaUang) : 0;
        let total = curSisa + amount;
        let ptsBaru = curPts + Math.floor(total / 10000);
        let sisaBaru = total % 10000;

        activeUser = { phone, name, dob, points: ptsBaru, sisaUang: sisaBaru, branch, lastVisit: new Date().toISOString() };
        fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(activeUser) });
        
        let db = getLocalDb(); db[phone] = activeUser; setLocalDb(db);
        document.getElementById('statusCloud').innerText = `✅ Saldo: ${ptsBaru} Pts | Sisa: Rp${sisaBaru}`;
        document.getElementById('btnWA').style.display = "block";
        alert("Simpan Berhasil!");
        document.getElementById('amount').value = "";
    }

    function kirimSapaan() {
        const pts = activeUser.points;
        let infoPoin = pts >= 10 ? `\n🔥 *Hore!* Poin Kakak sudah bisa ditukar dengan menu favorit gratis!\n` : `\n`;
        const pesan = `Halo Kak ${activeUser.name}! 👋\n\nTerima kasih sudah mampir ke *Seblak Salah*. 😊\n\nSaldo Poin: *${pts} Poin*\nTabungan Sisa: *Rp${activeUser.sisaUang}*${infoPoin}\n*Katalog Penukaran Poin:* \n🍹 10 Pts: Es Teh \n🥟 20 Pts: Dimsum \n🍲 25 Pts: Seblak Lengkap\n\nDitunggu kedatangannya lagi ya kak!`;
        window.open(`https://wa.me/${activeUser.phone.replace(/^0/,'62')}?text=${encodeURIComponent(pesan)}`);
    }

    function refreshDashboards() {
        const db = getLocalDb();
        const dash = document.getElementById('listDash');
        dash.innerHTML = "";
        const today = new Date();
        const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);

        for (let k in db) {
            const u = db[k];
            if(u.dob) {
                const d = new Date(u.dob);
                if((d.getDate()==today.getDate() && d.getMonth()==today.getMonth()) || (d.getDate()==tomorrow.getDate() && d.getMonth()==tomorrow.getMonth())) {
                    const msgU = `Halo Kak ${u.name}! 👋\n\nKami dari *Seblak Salah* ingin mengucapkan *Selamat Ulang Tahun*! 🎂✨\n\nSemoga panjang umur, sehat selalu, dan dilancarkan rezekinya. Sebagai kado spesial, Seblak Salah mau *MENTRAKTIR* Kakak 1 Porsi SEBLAK LENGKAP gratis! 😍\n\nSyaratnya cukup tunjukkan WA ini dan kartu identitas ke kasir. Khusus makan di tempat ya Kak. Ditunggu kedatangannya! 🍲✨`;
                    dash.innerHTML += `<div class="info-row"><span>🎂 ${u.name} (Ultah)</span><button style="border:none;background:var(--w);color:white;border-radius:8px;padding:5px 10px;font-weight:bold;" onclick="window.open('https://wa.me/${u.phone.replace(/^0/,'62')}?text=${encodeURIComponent(msgU)}')">🎁</button></div>`;
                }
            }
            if(u.lastVisit) {
                const diff = Math.floor((today - new Date(u.lastVisit)) / (1000*60*60*24));
                if(diff >= 10) {
                    const msgR = `Selamat Siang, apa kabarnya Kak ${u.name}? 👋\n\nSemoga Kakak sehat dan bahagia selalu ya. Di *Seblak Salah*, kami tiba-tiba teringat Kakak karena sudah ${diff} hari Kakak tidak mampir ke sini. ✨\n\nYuk, sempatkan mampir lagi. Kami tunggu ya Kak!`;
                    dash.innerHTML += `<div class="info-row"><span>😢 ${u.name} (${diff} hari)</span><button style="border:none;background:var(--s);color:white;border-radius:8px;padding:5px 10px;font-weight:bold;" onclick="window.open('https://wa.me/${u.phone.replace(/^0/,'62')}?text=${encodeURIComponent(msgR)}')">💬</button></div>`;
                }
            }
        }
    }

    function prosesRedeem() {
        const cost = parseInt(document.getElementById('reward').value);
        if(!activeUser || activeUser.points < cost) return alert("Poin kurang!");
        activeUser.points -= cost;
        fetch(URL_SCRIPT, { method: 'POST', mode: 'no-cors', body: JSON.stringify(activeUser) });
        let db = getLocalDb(); db[activeUser.phone] = activeUser; setLocalDb(db);
        document.getElementById('statusCloud').innerText = `✅ Saldo: ${activeUser.points} Pts`;
        alert("Redeem Berhasil!");
    }
    window.onload = refreshDashboards;
</script>
</body>
</html>

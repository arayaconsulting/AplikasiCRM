<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Seblak Salah - Powered by Araya Consulting</title>
    <style>
        :root {
            --primary: #e67e22;
            --secondary: #2c3e50;
            --success: #27ae60;
            --wa: #25d366;
            --danger: #e74c3c;
            --bg: #f4f7f6;
            --card: #ffffff;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 500px; margin: auto; }
        
        .branding { text-align: center; margin-bottom: 30px; }
        .branding img { max-width: 160px; height: auto; margin-bottom: 5px; }
        .branding h1 { font-size: 1.8rem; color: var(--primary); margin: 0; font-weight: 800; }
        .branding p { font-size: 0.85rem; color: #7f8c8d; margin: 2px 0; text-transform: uppercase; letter-spacing: 1px; }

        .card { background: var(--card); padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); border: 1px solid #edf2f7; margin-bottom: 20px; }
        
        .section-header { font-size: 0.75rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 25px 0 12px 0; display: flex; align-items: center; letter-spacing: 0.5px; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; margin-left: 15px; }

        label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 6px; color: #475569; }
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #f1f5f9; border-radius: 14px; box-sizing: border-box; font-size: 1rem; transition: 0.3s; background: #f8fafc; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 16px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-save { background: var(--success); color: white; }
        .btn-redeem { background: var(--secondary); color: white; }
        
        /* Dashboard Follow Up Style */
        .follow-up-item { display: flex; justify-content: space-between; align-items: center; padding: 15px; background: #fff5eb; border-radius: 15px; margin-bottom: 10px; border: 1px solid #ffe0b2; }
        .follow-up-info { font-size: 0.85rem; }
        .follow-up-info strong { display: block; font-size: 1rem; color: var(--secondary); }
        .btn-mini-wa { width: auto; padding: 8px 15px; background: var(--wa); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 0.8rem; cursor: pointer; }

        .result-box { margin-top: 20px; padding: 18px; border-radius: 18px; display: none; font-size: 0.95rem; line-height: 1.6; border-left: 6px solid; }
        .footer { text-align: center; margin-top: 40px; font-size: 0.75rem; color: #94a3b8; padding-top: 20px; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="branding">
        <img src="logo.png" alt="Araya Consulting">
        <h1>Seblak Salah</h1>
        <p>Loyalty Program Management</p>
    </div>

    <div class="card">
        <div class="section-header" style="margin-top:0;">Transaksi & Redeem</div>
        <input type="tel" id="phone" placeholder="Nomor WhatsApp (0812...)">
        <input type="text" id="name" placeholder="Nama Pelanggan">
        <input type="number" id="amount" placeholder="Nominal Belanja (Rp)">
        
        <button class="btn btn-save" onclick="tambahPoin()">Simpan Transaksi</button>
        
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="20">Dimsum (20 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn btn-redeem" onclick="redeemPoin()">Redeem Reward</button>
        
        <div id="output" class="result-box"></div>
    </div>

    <div class="card">
        <div class="section-header" style="margin-top:0;">Dashboard Follow-Up (≥ 7 Hari)</div>
        <div id="listFollowUp">
            <p style="text-align: center; font-size: 0.85rem; color: #999;">Memuat data pelanggan...</p>
        </div>
    </div>

    <div class="footer">
        Powered by <strong>Araya Consulting</strong><br>
        Sistem Manajemen Loyalitas Modern &copy; 2026
    </div>
</div>

<script>
    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbwVO6-KVDvfFMcx6gMYF8u-C6JpSildSVPEDZ2N84IuWsvij_YRVtZhF-uz4SOYnx-i/exec"; 
    const STORAGE_KEY = 'seblaksalah_crm_v2';
    
    function getDb() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    function saveDb(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); refreshFollowUpList(); }

    function syncToSheet(phone, name, points) {
        fetch(SPREADSHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ phone: phone, name: name, points: points }) });
    }

    function showOutput(msg, type) {
        const out = document.getElementById('output');
        out.style.display = 'block';
        out.style.background = type === 'success' ? '#f0fdf4' : '#f0f9ff';
        out.style.color = type === 'success' ? '#166534' : '#075985';
        out.style.borderColor = type === 'success' ? '#22c55e' : '#0ea5e9';
        out.innerHTML = msg;
    }

    function tambahPoin() {
        const phone = document.getElementById('phone').value;
        const nameInput = document.getElementById('name').value;
        const amount = parseInt(document.getElementById('amount').value);
        if (!phone || isNaN(amount) || amount < 10000) return alert("Data tidak lengkap!");

        const poinBaru = Math.floor(amount / 10000);
        let db = getDb();
        const dateNow = new Date().toISOString();

        if (db[phone]) {
            db[phone].points += poinBaru;
            db[phone].lastVisit = dateNow;
            if(nameInput) db[phone].name = nameInput;
        } else {
            db[phone] = { name: nameInput || "Pelanggan", points: poinBaru, lastVisit: dateNow };
        }
        saveDb(db);
        syncToSheet(phone, db[phone].name, db[phone].points);
        showOutput(`<strong>Poin Berhasil Ditambah!</strong><br>Saldo Sekarang: ${db[phone].points} Pts`, 'success');
        document.getElementById('amount').value = "";
    }

    function refreshFollowUpList() {
        const db = getDb();
        const listContainer = document.getElementById('listFollowUp');
        listContainer.innerHTML = "";
        const today = new Date();
        let count = 0;

        for (let phone in db) {
            const lastVisit = new Date(db[phone].lastVisit);
            const diffDays = Math.ceil(Math.abs(today - lastVisit) / (1000 * 60 * 60 * 24));

            if (diffDays >= 7) {
                count++;
                const item = document.createElement('div');
                item.className = 'follow-up-item';
                item.innerHTML = `
                    <div class="follow-up-info">
                        <strong>${db[phone].name}</strong>
                        ${diffDays} hari tidak datang (${db[phone].points} Pts)
                    </div>
                    <button class="btn-mini-wa" onclick="kirimRindu('${phone}', '${db[phone].name}', ${db[phone].points}, ${diffDays})">Kirim WA</button>
                `;
                listContainer.appendChild(item);
            }
        }

        if (count === 0) {
            listContainer.innerHTML = '<p style="text-align: center; font-size: 0.85rem; color: #999;">Semua pelanggan rajin mampir! 😊</p>';
        }
    }

    function kirimRindu(phone, nama, poin, hari) {
        let katalog = `*Katalog Penukaran Poin:* \n🍹 10 Poin: Es Teh Manis \n🥟 20 Poin: Dimsum \n🍲 25 Poin: Seblak Lengkap`;
        let pesan = `Selamat Siang Kak ${nama}, kangen nih dari *Seblak Salah*! ✨\n\nSudah ${hari} hari Kakak tidak mampir. Saldo Kakak saat ini *${poin} Poin*. \n\n${katalog} \n\nYuk, mampir hari ini dan tukarkan poin Kakak!`;
        
        const urlWA = `https://wa.me/${phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`;
        window.open(urlWA, '_blank');
    }

    function redeemPoin() {
        const phone = document.getElementById('phone').value;
        const cost = parseInt(document.getElementById('reward').value);
        let db = getDb();
        if (!db[phone] || db[phone].points < cost) return alert("Poin tidak cukup!");

        db[phone].points -= cost;
        db[phone].lastVisit = new Date().toISOString();
        saveDb(db);
        syncToSheet(phone, db[phone].name, db[phone].points);
        showOutput(`<strong>Redeem Berhasil!</strong><br>Sisa Saldo: ${db[phone].points} Pts`, 'success');
    }

    // Jalankan daftar saat pertama buka
    window.onload = refreshFollowUpList;
</script>

</body>
</html>

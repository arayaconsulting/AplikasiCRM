<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Seblak Salah V4 - Reset Total</title>
    <style>
        :root { --p: #e67e22; --s: #2c3e50; --g: #27ae60; --w: #25d366; --bday: #3498db; --bg: #f4f7f6; }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg); padding: 15px; margin: 0; color: #333; }
        .container { max-width: 480px; margin: auto; }
        .card { background: white; padding: 22px; border-radius: 24px; box-shadow: 0 8px 20px rgba(0,0,0,0.05); margin-bottom: 20px; border: 1px solid rgba(255,255,255,0.8); }
        h1 { color: var(--p); text-align: center; margin: 0; font-size: 1.8rem; }
        label { display: block; font-weight: 700; font-size: 0.75rem; margin: 15px 0 6px 5px; color: #64748b; text-transform: uppercase; letter-spacing: 0.5px; }
        input, select { width: 100%; padding: 14px; border: 2px solid #f1f5f9; border-radius: 14px; box-sizing: border-box; font-size: 1rem; background: #f8fafc; font-weight: 500; }
        .btn { width: 100%; padding: 16px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; margin-top: 10px; font-size: 1rem; transition: 0.3s; display: flex; align-items: center; justify-content: center; }
        .btn-save { background: var(--g); color: white; box-shadow: 0 4px 12px rgba(39, 174, 96, 0.2); }
        .status { font-size: 0.85rem; text-align: right; color: var(--p); font-weight: 700; margin-bottom: 10px; height: 1.2rem; }
        .section-header { font-size: 0.75rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 20px 0 10px; display: flex; align-items: center; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; margin-left: 10px; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 0.9rem; }
        .btn-mini { width: auto; padding: 6px 12px; font-size: 0.75rem; margin: 0; border-radius: 8px; }
    </style>
</head>
<body>
<div class="container">
    <div class="card" style="text-align:center; padding: 15px;">
        <h1>Seblak Salah</h1>
        <p style="margin:0; font-weight:800; color:#94a3b8; font-size: 0.7rem; text-transform: uppercase; letter-spacing: 2px;">Loyalty Management</p>
    </div>

    <div class="card">
        <label>📍 Cabang</label>
        <select id="branch">
            <option value="Pahlawan">Cabang Pahlawan</option>
            <option value="Mondokan">Cabang Mondokan</option>
            <option value="Merakurak">Mitra Merakurak</option>
            <option value="Jenu">Mitra Jenu</option>
        </select>

        <label>📱 No. WhatsApp</label>
        <input type="tel" id="phone" placeholder="08..." onblur="cekDatabase()">
        <div id="status" class="status"></div>

        <label>👤 Nama Pelanggan</label>
        <input type="text" id="name" placeholder="Nama Lengkap">

        <label>🎂 Tanggal Lahir</label>
        <input type="date" id="dob">

        <label>💰 Belanja (Rp)</label>
        <input type="number" id="amount" placeholder="Contoh: 20000">

        <button class="btn btn-save" onclick="prosesSimpan()">Simpan Transaksi</button>
        <button id="btnWA" class="btn" style="background:var(--w); color:white; display:none;" onclick="kirimSapaan()">Kirim Sapaan (WA)</button>

        <div class="section-header">Tukar Poin</div>
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="20">Dimsum (20 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn" style="background:var(--s); color:white;" onclick="prosesRedeem()">Tukarkan Poin</button>
    </div>

    <div class="card">
        <div class="section-header" style="color:var(--bday);">🎂 Ultah (Besok/Hari Ini)</div>
        <div id="listUltah"></div>

        <div class="section-header" style="color:var(--s); margin-top:20px;">🚪 Rindu (≥ 10 Hari Gak Mampir)</div>
        <div id="listRindu"></div>
    </div>
</div>

<script>
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwBP1Q3nBuRj5tzkaJMsGZkX05tlZvMLbL0aM-YyaLf1dV6CMqTh3rATjyXVhD7LgrHrg/exec"; 
    const DB_KEY = "seblak_db_v4";
    let activeUser = null;

    function getLocalDb() { return JSON.parse(localStorage.getItem(DB_KEY)) || {}; }
    function setLocalDb(data) { localStorage.setItem(DB_KEY, JSON.stringify(data)); refreshDashboards(); }

    async function cekDatabase() {
        const phone = document.getElementById('phone').value.trim();
        if(!phone) return;
        document.getElementById('status').innerText = "Mengecek...";
        try {
            const res = await fetch(`${APPS_SCRIPT_URL}?phone=${phone}`);
            const data = await res.json();
            if(!data.error) {
                document.getElementById('name').value = data.name;
                if(data.dob) document.getElementById('dob').value = data.dob.split('T')[0];
                document.getElementById('status').innerText = `Saldo: ${data.points} Pts | Sisa: Rp${data.sisaUang}`;
                activeUser = { phone, ...data };
                let db = getLocalDb(); db[phone] = activeUser; setLocalDb(db);
            } else {
                document.getElementById('status').innerText = "Pelanggan Baru";
                activeUser = null;
            }
        } catch(e) { document.getElementById('status').innerText = "Offline/Error"; }
    }

    function prosesSimpan() {
        const phone = document.getElementById('phone').value.trim();
        const name = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const amount = parseInt(document.getElementById('amount').value || 0);
        const branch = document.getElementById('branch').value;
        if(!phone || !name) return alert("Nama & WA wajib diisi!");

        let curPts = activeUser ? parseInt(activeUser.points) : 0;
        let curSisa = activeUser ? parseInt(activeUser.sisaUang) : 0;
        
        let total = curSisa + amount;
        let ptsBaru = curPts + Math.floor(total / 10000);
        let sisaBaru = total % 10000;

        const payload = { phone, name, dob, points: ptsBaru, sisaUang: sisaBaru, branch, lastVisit: new Date().toISOString() };
        
        fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
        
        activeUser = payload;
        let db = getLocalDb(); db[phone] = payload; setLocalDb(db);
        
        document.getElementById('status').innerText = `Saldo: ${ptsBaru} Pts | Sisa: Rp${sisaBaru}`;
        document.getElementById('btnWA').style.display = "flex";
        alert("Berhasil Disimpan!");
        document.getElementById('amount').value = "";
    }

    function kirimSapaan() {
        const infoPoin = activeUser.points >= 10 ? `\n🔥 *Hore!* Poin Kakak sudah bisa ditukar menu gratis!\n` : `\n`;
        const pesan = `Halo Kak ${activeUser.name}! 👋\n\nTerima kasih sudah mampir ke *Seblak Salah*. 😊\n\nSaldo Poin: *${activeUser.points} Poin*\nTabungan Sisa: *Rp${activeUser.sisaUang}*${infoPoin}*Katalog Poin:* \n🍹 10 Pts: Es Teh \n🥟 20 Pts: Dimsum \n🍲 25 Pts: Seblak Lengkap\n\nDitunggu kedatangannya lagi ya kak!`;
        window.open(`https://wa.me/${activeUser.phone.replace(/^0/,'62')}?text=${encodeURIComponent(pesan)}`);
    }

    function refreshDashboards() {
        const db = getLocalDb();
        const listUltah = document.getElementById('listUltah');
        const listRindu = document.getElementById('listRindu');
        listUltah.innerHTML = ""; listRindu.innerHTML = "";
        
        const skrg = new Date();
        const bsk = new Date(); bsk.setDate(skrg.getDate() + 1);

        for (let key in db) {
            const u = db[key];
            if(u.dob) {
                const d = new Date(u.dob);
                if((d.getDate() == skrg.getDate() && d.getMonth() == skrg.getMonth()) || (d.getDate() == bsk.getDate() && d.getMonth() == bsk.getMonth())) {
                    listUltah.innerHTML += `<div class="item-row"><span>🎉 ${u.name}</span><button class="btn btn-mini" style="background:var(--w); color:white;" onclick="window.open('https://wa.me/${u.phone.replace(/^0/,'62')}?text=${encodeURIComponent('Halo Kak ' + u.name + '! 👋\\n\\nKami dari *Seblak Salah* ingin mengucapkan *Selamat Ulang Tahun*! 🎂✨\\n\\nSemoga panjang umur, sehat selalu, dan dilancarkan rezekinya. Sebagai kado spesial, Seblak Salah mau *MENTRAKTIR* Kakak 1 Porsi SEBLAK LENGKAP gratis! 😍')}')">WA</button></div>`;
                }
            }
            if(u.lastVisit) {
                const lama = Math.floor((skrg - new Date(u.lastVisit)) / (1000*60*60*24));
                if(lama >= 10) {
                    listRindu.innerHTML += `<div class="item-row"><span>😢 ${u.name} (${lama} hari)</span><button class="btn btn-mini" style="background:var(--s); color:white;" onclick="window.open('https://wa.me/${u.phone.replace(/^0/,'62')}?text=${encodeURIComponent('Selamat Siang, apa kabarnya Kak ' + u.name + '? 👋\\n\\nSemoga Kakak sehat dan bahagia selalu ya. Di *Seblak Salah*, kami tiba-tiba teringat Kakak karena sudah ' + lama + ' hari Kakak tidak mampir ke sini. ✨\\n\\nYuk, sempatkan mampir lagi. Kami tunggu ya Kak!')}')">Sapa</button></div>`;
                }
            }
        }
    }

    function prosesRedeem() {
        const cost = parseInt(document.getElementById('reward').value);
        if(!activeUser || activeUser.points < cost) return alert("Poin kurang!");
        activeUser.points -= cost;
        fetch(APPS_SCRIPT_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ ...activeUser, branch: document.getElementById('branch').value }) });
        let db = getLocalDb(); db[activeUser.phone] = activeUser; setLocalDb(db);
        document.getElementById('status').innerText = `Saldo: ${activeUser.points} Pts`;
        alert("Redeem Berhasil!");
    }

    window.onload = refreshDashboards;
</script>
</body>
</html>

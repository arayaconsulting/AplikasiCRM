<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loyalty CRM System - Araya Consulting</title>
    <style>
        :root {
            --primary-bg: #f0f2f5;
            --card-bg: #ffffff;
            --accent-color: #3498db;
            --success-color: #27ae60;
            --wa-color: #25d366;
            --text-main: #2c3e50;
            --text-muted: #7f8c8d;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--primary-bg); color: var(--text-main); margin: 0; padding: 20px; }
        .container { max-width: 450px; margin: auto; }
        
        .brand-section { text-align: center; margin-bottom: 25px; }
        .brand-section img { max-width: 140px; height: auto; margin-bottom: 10px; }
        .brand-section h1 { font-size: 1rem; text-transform: uppercase; letter-spacing: 2px; margin: 0; }

        .card { background: var(--card-bg); padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); }
        
        .section-header { font-size: 0.75rem; font-weight: bold; color: var(--text-muted); text-transform: uppercase; margin: 20px 0 10px 0; display: flex; align-items: center; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #eee; margin-left: 10px; }

        label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 5px; }
        input, select { width: 100%; padding: 12px; margin-bottom: 15px; border: 1.5px solid #eee; border-radius: 12px; box-sizing: border-box; font-size: 1rem; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem; transition: 0.2s; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-check { background: transparent; border: 2px solid var(--accent-color); color: var(--accent-color); }
        .btn-save { background: var(--success-color); color: white; }
        .btn-wa { background: var(--wa-color); color: white; }
        .btn-redeem { background: var(--text-main); color: white; }
        
        .result-box { margin-top: 15px; padding: 15px; border-radius: 12px; display: none; font-size: 0.9rem; line-height: 1.5; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.7rem; color: var(--text-muted); padding-top: 15px; border-top: 1px solid #ddd; }
    </style>
</head>
<body>

<div class="container">
    <div class="brand-section">
        <img src="logo.png" alt="Araya Consulting">
        <h1>Loyalty CRM System</h1>
    </div>

    <div class="card">
        <div class="section-header" style="margin-top:0;">Cek & Bagikan Poin</div>
        <input type="tel" id="phone" placeholder="Nomor WhatsApp Pelanggan">
        <div style="display: flex; gap: 10px;">
            <button class="btn btn-check" onclick="cekPoin()">Cek Poin</button>
            <button class="btn btn-wa" onclick="bagikanWA()">Bagikan WA</button>
        </div>

        <div class="section-header">Input Transaksi</div>
        <input type="text" id="name" placeholder="Nama Pelanggan Baru">
        <input type="number" id="amount" placeholder="Nominal Belanja (Rp)">
        <button class="btn btn-save" onclick="tambahPoin()">Simpan & Tambah Poin</button>

        <div class="section-header">Katalog Hadiah</div>
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="20">Dimsum (20 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn btn-redeem" onclick="redeemPoin()">Tukarkan Poin</button>

        <div id="output" class="result-box"></div>
    </div>

    <div class="footer">
        Powered by <strong>Araya Consulting</strong><br>
        Sistem Manajemen Loyalitas Digital &copy; 2026
    </div>
</div>

<script>
    const STORAGE_KEY = 'arayacrm_data';
    
    function getDb() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    function saveDb(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function showOutput(msg, type) {
        const out = document.getElementById('output');
        out.style.display = 'block';
        out.style.background = type === 'success' ? '#e8f5e9' : (type === 'info' ? '#e3f2fd' : '#ffebee');
        out.style.color = type === 'success' ? '#2e7d32' : (type === 'info' ? '#1565c0' : '#c62828');
        out.innerHTML = msg;
    }

    function cekPoin() {
        const phone = document.getElementById('phone').value;
        const db = getDb();
        if (!phone) return alert("Isi nomor WhatsApp!");
        if (db[phone]) {
            showOutput(`<strong>Status: Member Aktif</strong><br>Nama: ${db[phone].name}<br>Saldo: <strong>${db[phone].points} Poin</strong>`, 'info');
        } else {
            showOutput("Nomor belum terdaftar.", 'error');
        }
    }

    function tambahPoin() {
        const phone = document.getElementById('phone').value;
        let nameInput = document.getElementById('name').value;
        const amount = parseInt(document.getElementById('amount').value);
        if (!phone || isNaN(amount) || amount < 10000) return alert("Minimal belanja Rp10.000");

        const poinBaru = Math.floor(amount / 10000);
        let db = getDb();
        if (db[phone]) {
            db[phone].points += poinBaru;
        } else {
            db[phone] = { name: nameInput || "Pelanggan", points: poinBaru };
        }
        saveDb(db);
        showOutput(`<strong>Poin Berhasil Ditambah!</strong><br>Total Saldo: <strong>${db[phone].points} Pts</strong>`, 'success');
        document.getElementById('amount').value = "";
    }

    function bagikanWA() {
        const phone = document.getElementById('phone').value;
        const db = getDb();
        if (!phone || !db[phone]) return alert("Data pelanggan tidak ditemukan!");

        const nama = db[phone].name;
        const poin = db[phone].points;
        let pesan = `Halo kak ${nama}! 👋\n\nSaat ini kakak memiliki *${poin} Poin Loyalitas* di outlet kami.`;

        // Logika Ajakan berdasarkan jumlah poin
        if (poin >= 25) {
            pesan += `\n\nWah! Poin kakak sudah cukup untuk ditukarkan dengan *1 Porsi Seblak Lengkap* lho! 😍\nYuk, mampir ke outlet sekarang buat tukerin poinnya!`;
        } else if (poin >= 20) {
            pesan += `\n\nKeren! Kakak sudah bisa menukarkan poin dengan *Dimsum* pilihan. 🥟\nDitunggu kehadirannya di outlet ya kak!`;
        } else if (poin >= 10) {
            pesan += `\n\nAsik! Poin kakak sudah bisa ditukar dengan *Es Teh Manis* segar. 🍹\nYuk tambah terus transaksinya biar bisa tukar hadiah yang lebih besar!`;
        } else {
            pesan += `\n\nYuk kak, tingkatkan terus transaksinya di outlet kami! Kumpulkan minimal *10 Poin* untuk mulai mendapatkan hadiah menarik. Ditunggu ya! 😊`;
        }

        const urlWA = `https://wa.me/${phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`;
        window.open(urlWA, '_blank');
    }

    function redeemPoin() {
        const phone = document.getElementById('phone').value;
        const select = document.getElementById('reward');
        const cost = parseInt(select.value);
        let db = getDb();
        if (!db[phone]) return alert("Data tidak ditemukan!");
        if (db[phone].points < cost) return alert("Poin tidak cukup!");

        db[phone].points -= cost;
        saveDb(db);
        showOutput(`<strong>Redeem Sukses!</strong><br>Sisa Poin: <strong>${db[phone].points} Pts</strong>`, 'success');
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Seblak Salah - Multibranch System</title>
    <style>
        :root { --primary: #e67e22; --secondary: #2c3e50; --success: #27ae60; --wa: #25d366; --birthday: #3498db; --bg: #f4f7f6; --card: #ffffff; }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: auto; }
        .branding { text-align: center; margin-bottom: 25px; }
        .branding img { width: 150px; height: auto; margin-bottom: 5px; display: block; margin-left: auto; margin-right: auto; }
        .branding h1 { font-size: 1.6rem; color: var(--primary); margin: 0; font-weight: 800; }
        .card { background: var(--card); padding: 20px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #edf2f7; margin-bottom: 15px; }
        .section-header { font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 20px 0 10px 0; display: flex; align-items: center; letter-spacing: 0.5px; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; margin-left: 10px; }
        label { font-size: 0.7rem; font-weight: 600; display: block; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #f1f5f9; border-radius: 12px; box-sizing: border-box; font-size: 0.95rem; background: #f8fafc; font-weight: 500; }
        .btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 0.95rem; transition: 0.3s; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save { background: var(--success); color: white; }
        .btn-wa { background: var(--wa); color: white; display: none; }
        .btn-redeem { background: var(--secondary); color: white; }
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 15px; margin-bottom: 8px; border: 1px solid; }
        .follow-up { background: #fff5eb; border-color: #ffe0b2; }
        .birthday-row { background: #eef7ff; border-color: #cde4f7; }
        .info-text { font-size: 0.8rem; }
        .info-text strong { display: block; font-size: 0.9rem; color: var(--secondary); }
        .btn-mini-wa { padding: 6px 12px; background: var(--wa); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }
        .result-box { margin-top: 15px; padding: 15px; border-radius: 15px; display: none; font-size: 0.9rem; border-left: 5px solid; }
        .status-cloud { font-size: 0.65rem; color: #94a3b8; margin-top: -10px; margin-bottom: 10px; text-align: right; font-style: italic; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.7rem; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 15px; }
        #branch { border: 2px solid var(--primary); background: #fffcf9; color: var(--primary); font-weight: 800; }
    </style>
</head>
<body>

<div class="container">
    <div class="branding">
        <img src="logo.png" alt="Araya Consulting">
        <h1>Seblak Salah</h1>
        <p>LOYALTY PROGRAM MANAGEMENT</p>
    </div>

    <div class="card">
        <div class="section-header" style="margin-top:0;">LOKASI CABANG / MITRA</div>
        <select id="branch">
            <option value="Cabang Pahlawan">📍 Cabang Pahlawan</option>
            <option value="Cabang Mondokan">📍 Cabang Mondokan</option>
            <option value="Mitra Merakurak">🤝 Mitra Merakurak</option>
            <option value="Mitra Jenu">🤝 Mitra Jenu</option>
        </select>

        <div class="section-header">INPUT TRANSAKSI</div>
        <input type="tel" id="phone" placeholder="Nomor WA (Contoh: 0812...)" onblur="cekDataCloud()">
        <div id="statusCloud" class="status-cloud"></div>
        <input type="text" id="name" placeholder="Nama Pelanggan">
        <label>Tanggal Lahir</label>
        <input type="date" id="dob">
        <input type="number" id="amount" placeholder="Nominal Belanja (Rp)">
        
        <button id="btnSave" class="btn btn-save" onclick="tambahPoin()">Simpan Transaksi</button>
        <button id="btnSapa" class="btn btn-wa" style="display: none; background-color: var(--wa); color: white;" onclick="sapaPelanggan()">Kirim Sapaan (WA)</button>
        
        <div class="section-header">REDEEM REWARD</div>
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="20">Dimsum (20 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn btn-redeem" onclick="redeemPoin()">Tukarkan Poin</button>
        <div id="output" class="result-box"></div>
    </div>

    <div class="card">
        <div class="section-header" style="color: var(--birthday);">🎂 PENGINGAT ULANG TAHUN</div>
        <div id="listUltah"></div>
    </div>

    <div class="card">
        <div class="section-header">🚪 DASHBOARD FOLLOW-UP (≥ 10 HARI)</div>
        <div id="listFollowUp"></div>
    </div>

    <div class="footer">Developed by <strong>Araya Consulting</strong> &copy; 2026</div>
</div>

<script>
    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbykPg33CZ1Zk8yUPViaD45E7UVYxU-f4z4Wn7kuHzt6X3Cg7AETlXaUO99ggoxWefVS/exec"; 
    const STORAGE_KEY = 'seblaksalah_crm_v3';
    let lastActiveUser = null;

    function getDb() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    function saveDb(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); refreshDashboards(); }

    function updateStatusUI(pts, sisa) {
        const el = document.getElementById('statusCloud');
        el.innerHTML = `✅ Saldo: ${pts} Pts | Sisa: Rp${sisa}`;
        el.style.color = "#27ae60";
    }

    async function cekDataCloud() {
        const phone = document.getElementById('phone').value;
        if (!phone) return;
        document.getElementById('statusCloud').innerHTML = "Mengecek cloud...";
        try {
            const response = await fetch(`${SPREADSHEET_URL}?phone=${phone}`);
            const data = await response.json();
            if (data && !data.error) {
                document.getElementById('name').value = data.name || "";
                if (data.dob) document.getElementById('dob').value = data.dob;
                let db = getDb();
                db[phone] = { name: data.name, points: data.points, lastVisit: data.lastVisit, dob: data.dob, sisaUang: data.sisaUang || 0 };
                saveDb(db);
                updateStatusUI(data.points, data.sisaUang);
            } else {
                document.getElementById('statusCloud').innerHTML = "ℹ️ Pelanggan Baru";
                document.getElementById('statusCloud').style.color = "#e67e22";
            }
        } catch (e) { console.error(e); }
    }

    function tambahPoin() {
        const phone = document.getElementById('phone').value;
        const nameInput = document.getElementById('name').value;
        const dobInput = document.getElementById('dob').value;
        const branch = document.getElementById('branch').value;
        const amount = parseInt(document.getElementById('amount').value || 0);
        
        if (!phone) return alert("Isi nomor WA!");
        
        let db = getDb();
        const now = new Date().toISOString();
        let user = db[phone] || { points: 0, sisaUang: 0 };
        
        let currentSisa = parseInt(user.sisaUang) || 0;
        let totalUang = currentSisa + amount;
        let poinBaru = Math.floor(totalUang / 10000);
        let sisaBaru = totalUang % 10000;
        
        user.points = (parseInt(user.points) || 0) + poinBaru;
        user.sisaUang = sisaBaru;
        user.lastVisit = now;
        if(nameInput) user.name = nameInput;
        if(dobInput) user.dob = dobInput;
        
        db[phone] = user;
        saveDb(db);

        fetch(SPREADSHEET_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ phone, name: user.name, points: user.points, dob: user.dob, amount, branch }) 
        });

        lastActiveUser = { phone, ...user };
        updateStatusUI(user.points, user.sisaUang);
        
        const out = document.getElementById('output');
        out.style.display = 'block'; out.style.background = '#f0fdf4';
        out.innerHTML = `✅ <strong>Simpan Berhasil!</strong><br>Poin: ${user.points} | Cabang: ${branch}`;
        document.getElementById('btnSapa').style.display = 'flex';
        document.getElementById('amount').value = "";
    }

    function sapaPelanggan() {
        if (!lastActiveUser) return;
        const pts = lastActiveUser.points;
        const pesan = `Halo Kak ${lastActiveUser.name}! 👋\nTerima kasih sudah mampir ke *Seblak Salah*. Saldo Poin Kakak: *${pts} Poin*. Ditunggu kedatangannya lagi ya kak!`;
        window.open(`https://wa.me/${lastActiveUser.phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`, '_blank');
        document.getElementById('btnSapa').style.display = 'none';
    }

    function refreshDashboards() {
        const db = getDb();
        const listUltah = document.getElementById('listUltah');
        const listFollowUp = document.getElementById('listFollowUp');
        listUltah.innerHTML = ""; listFollowUp.innerHTML = "";
        const today = new Date();

        for (let phone in db) {
            // Dashboard Ultah
            if (db[phone].dob) {
                const bday = new Date(db[phone].dob);
                if (bday.getDate() === today.getDate() && bday.getMonth() === today.getMonth()) {
                    const row = document.createElement('div'); row.className = 'item-row birthday-row';
                    row.innerHTML = `<div class="info-text"><strong>${db[phone].name}</strong>HARI INI ULTAH! 🎂</div><button class="btn-mini-wa" onclick="window.open('https://wa.me/${phone.replace(/^0/,'62')}?text=HBD!')">Traktir</button>`;
                    listUltah.appendChild(row);
                }
            }
            // Dashboard Follow Up (10 Hari)
            if (db[phone].lastVisit) {
                const diffDays = Math.ceil(Math.abs(today - new Date(db[phone].lastVisit)) / (1000 * 60 * 60 * 24));
                if (diffDays >= 10) {
                    const row = document.createElement('div'); row.className = 'item-row follow-up';
                    row.innerHTML = `<div class="info-text"><strong>${db[phone].name}</strong>(${diffDays} hari tidak mampir)</div><button class="btn-mini-wa" onclick="window.open('https://wa.me/${phone.replace(/^0/,'62')}?text=Kangen!')">Sapa</button>`;
                    listFollowUp.appendChild(row);
                }
            }
        }
    }

    function redeemPoin() {
        const phone = document.getElementById('phone').value;
        const cost = parseInt(document.getElementById('reward').value);
        const branch = document.getElementById('branch').value;
        let db = getDb();
        if (!db[phone] || db[phone].points < cost) return alert("Poin kurang!");
        
        db[phone].points -= cost; 
        saveDb(db);
        updateStatusUI(db[phone].points, db[phone].sisaUang);
        
        fetch(SPREADSHEET_URL, { 
            method: 'POST', 
            mode: 'no-cors', 
            body: JSON.stringify({ phone, name: db[phone].name, points: db[phone].points, dob: db[phone].dob, amount: 0, branch }) 
        });
        
        const out = document.getElementById('output');
        out.style.display = 'block'; out.style.background = '#fef2f2';
        out.innerHTML = `🎁 <strong>Redeem Berhasil!</strong><br>Sisa: ${db[phone].points} Pts | Lokasi: ${branch}`;
    }
    window.onload = refreshDashboards;
</script>
</body>
</html>

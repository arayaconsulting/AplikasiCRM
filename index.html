<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Seblak Salah - Powered by Araya Consulting</title>
    <style>
        :root {
            --primary: #e67e22;
            --secondary: #2c3e50;
            --success: #27ae60;
            --wa: #25d366;
            --birthday: #3498db;
            --bg: #f4f7f6;
            --card: #ffffff;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 15px; color: #333; }
        .container { max-width: 500px; margin: auto; }
        
        .branding { text-align: center; margin-bottom: 25px; }
        .branding img { max-width: 140px; height: auto; margin-bottom: 5px; }
        .branding h1 { font-size: 1.6rem; color: var(--primary); margin: 0; font-weight: 800; }
        .branding p { font-size: 0.8rem; color: #7f8c8d; margin: 2px 0; text-transform: uppercase; letter-spacing: 1px; }

        .card { background: var(--card); padding: 20px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #edf2f7; margin-bottom: 15px; }
        
        .section-header { font-size: 0.7rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 20px 0 10px 0; display: flex; align-items: center; letter-spacing: 0.5px; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; margin-left: 10px; }

        label { font-size: 0.8rem; font-weight: 600; display: block; margin-bottom: 4px; color: #475569; }
        input, select { width: 100%; padding: 12px; margin-bottom: 12px; border: 2px solid #f1f5f9; border-radius: 12px; box-sizing: border-box; font-size: 0.95rem; background: #f8fafc; }

        .btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-weight: 700; cursor: pointer; font-size: 0.95rem; transition: 0.3s; margin-bottom: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-save { background: var(--success); color: white; }
        .btn-wa { background: var(--wa); color: white; display: none; }
        .btn-redeem { background: var(--secondary); color: white; }
        
        /* Dashboard Items */
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-radius: 15px; margin-bottom: 8px; border: 1px solid; }
        .follow-up { background: #fff5eb; border-color: #ffe0b2; }
        .birthday-row { background: #eef7ff; border-color: #cde4f7; }
        
        .info-text { font-size: 0.8rem; }
        .info-text strong { display: block; font-size: 0.9rem; color: var(--secondary); }
        .btn-mini-wa { padding: 6px 12px; background: var(--wa); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 0.75rem; cursor: pointer; }

        .result-box { margin-top: 15px; padding: 15px; border-radius: 15px; display: none; font-size: 0.9rem; border-left: 5px solid; }
        .footer { text-align: center; margin-top: 30px; font-size: 0.7rem; color: #94a3b8; border-top: 1px solid #e2e8f0; padding-top: 15px; }
    </style>
</head>
<body>

<div class="container">
    <div class="branding">
        <img src="logo.png" alt="Araya Consulting">
        <h1>Seblak Salah</h1>
        <p>Loyalty Program Management</p>
    </div>

    <div class="card">
        <div class="section-header" style="margin-top:0;">Input Transaksi</div>
        <input type="tel" id="phone" placeholder="Nomor WA (Contoh: 0812...)">
        <input type="text" id="name" placeholder="Nama Pelanggan">
        <label>Tanggal Lahir (H-1 Ultah akan muncul pengingat)</label>
        <input type="date" id="dob">
        <input type="number" id="amount" placeholder="Nominal Belanja (Rp)">
        
        <button id="btnSave" class="btn btn-save" onclick="tambahPoin()">Simpan & Update Cloud</button>
        <button id="btnSapa" class="btn btn-wa" onclick="sapaPelanggan()">Kirim Sapaan (WA)</button>
        
        <div class="section-header">Penukaran Reward</div>
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="20">Dimsum (20 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn btn-redeem" onclick="redeemPoin()">Redeem Sekarang</button>
        <div id="output" class="result-box"></div>
    </div>

    <div class="card">
        <div class="section-header" style="color: var(--birthday);">🎂 Pengingat Ulang Tahun (H-1)</div>
        <div id="listUltah"><p style="text-align: center; font-size: 0.8rem; color: #999;">Tidak ada yang ultah hari ini/besok.</p></div>
    </div>

    <div class="card">
        <div class="section-header">🚪 Dashboard Follow-Up (≥ 7 Hari)</div>
        <div id="listFollowUp"><p style="text-align: center; font-size: 0.8rem; color: #999;">Memuat data...</p></div>
    </div>

    <div class="footer">Developed by <strong>Araya Consulting</strong> &copy; 2026</div>
</div>

<script>
    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbx0Uu38Wuyz4egEHQlrluUTNN-4rqfaWdMKP7jjy2CHP5Bc4b0yfEmb0x_75-hzMHwY/exec"; 
    const STORAGE_KEY = 'seblaksalah_crm_v3';
    let lastActiveUser = null;

    function getDb() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    function saveDb(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); refreshDashboards(); }

    function syncToSheet(phone, name, points, dob) {
        fetch(SPREADSHEET_URL, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ phone, name, points, dob }) });
    }

    function tambahPoin() {
        const phone = document.getElementById('phone').value;
        const nameInput = document.getElementById('name').value;
        const dob = document.getElementById('dob').value;
        const amount = parseInt(document.getElementById('amount').value);
        if (!phone || isNaN(amount) || amount < 10000) return alert("Data wajib diisi!");

        let db = getDb();
        const now = new Date().toISOString();
        const poinBaru = Math.floor(amount / 10000);

        if (db[phone]) {
            db[phone].points += poinBaru;
            db[phone].lastVisit = now;
            if(nameInput) db[phone].name = nameInput;
            if(dob) db[phone].dob = dob;
        } else {
            db[phone] = { name: nameInput || "Pelanggan", points: poinBaru, lastVisit: now, dob: dob || "" };
        }
        
        saveDb(db);
        syncToSheet(phone, db[phone].name, db[phone].points, db[phone].dob);
        lastActiveUser = { phone, ...db[phone] };
        
        const out = document.getElementById('output');
        out.style.display = 'block';
        out.style.background = '#f0fdf4';
        out.style.color = '#166534';
        out.innerHTML = `✅ <strong>Berhasil!</strong><br>Saldo ${db[phone].name}: ${db[phone].points} Pts`;
        document.getElementById('btnSapa').style.display = 'flex';
        document.getElementById('amount').value = "";
    }

    function sapaPelanggan() {
        if (!lastActiveUser) return;
        const pesan = `Halo Kak ${lastActiveUser.name}! 👋\n\nTerima kasih sudah mampir ke *Seblak Salah*. Saldo poin Kakak sekarang: *${lastActiveUser.points} Poin*.\n\nDitunggu kedatangannya lagi ya!`;
        window.open(`https://wa.me/${lastActiveUser.phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`, '_blank');
        document.getElementById('btnSapa').style.display = 'none';
    }

    function refreshDashboards() {
        const db = getDb();
        const listUltah = document.getElementById('listUltah');
        const listFollowUp = document.getElementById('listFollowUp');
        listUltah.innerHTML = ""; listFollowUp.innerHTML = "";
        
        const today = new Date();
        const tomorrow = new Date(); tomorrow.setDate(today.getDate() + 1);
        let countUltah = 0, countFollow = 0;

        for (let phone in db) {
            // 1. Logika Ultah (H-1)
            if (db[phone].dob) {
                const bday = new Date(db[phone].dob);
                const isToday = bday.getDate() === today.getDate() && bday.getMonth() === today.getMonth();
                const isTomorrow = bday.getDate() === tomorrow.getDate() && bday.getMonth() === tomorrow.getMonth();

                if (isToday || isTomorrow) {
                    countUltah++;
                    const row = document.createElement('div');
                    row.className = 'item-row birthday-row';
                    const status = isToday ? "HARI INI! 🎂" : "Besok 🎁";
                    row.innerHTML = `<div class="info-text"><strong>${db[phone].name}</strong>Ultah: ${status}</div>
                        <button class="btn-mini-wa" onclick="kirimUltah('${phone}', '${db[phone].name}')">Kirim Traktiran</button>`;
                    listUltah.appendChild(row);
                }
            }

            // 2. Logika Follow Up
            const diffDays = Math.ceil(Math.abs(today - new Date(db[phone].lastVisit)) / (1000 * 60 * 60 * 24));
            if (diffDays >= 7) {
                countFollow++;
                const row = document.createElement('div');
                row.className = 'item-row follow-up';
                row.innerHTML = `<div class="info-text"><strong>${db[phone].name}</strong>${diffDays} hari tidak mampir</div>
                    <button class="btn-mini-wa" onclick="kirimRindu('${phone}', '${db[phone].name}', ${db[phone].points}, ${diffDays})">Sapa</button>`;
                listFollowUp.appendChild(row);
            }
        }
        if (countUltah === 0) listUltah.innerHTML = '<p style="text-align: center; font-size: 0.8rem; color: #999;">Tidak ada yang ultah terdekat.</p>';
        if (countFollow === 0) listFollowUp.innerHTML = '<p style="text-align: center; font-size: 0.8rem; color: #999;">Semua pelanggan aktif mampir! 😊</p>';
    }

    function kirimUltah(phone, nama) {
        const pesan = `Halo Kak ${nama}! 👋\n\nKami dari *Seblak Salah* ingin mengucapkan *Selamat Ulang Tahun*! 🎂✨\n\nSemoga panjang umur, sehat selalu, dan dilancarkan rezekinya. Sebagai kado spesial, Seblak Salah mau *MENTRAKTIR* Kakak 1 Porsi SEBLAK LENGKAP gratis! 😍\n\nSyaratnya cukup tunjukkan WA ini dan kartu identitas ke kasir. Khusus makan di tempat ya Kak. Ditunggu kedatangannya! 🍲✨`;
        window.open(`https://wa.me/${phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    function kirimRindu(phone, nama, poin, hari) {
        const pesan = `Halo Kak ${nama}, kangen nih dari *Seblak Salah*! ✨ Sudah ${hari} hari Kakak tidak mampir. Saldo Kakak: *${poin} Pts*. Yuk mampir!`;
        window.open(`https://wa.me/${phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`, '_blank');
    }

    function redeemPoin() {
        const phone = document.getElementById('phone').value;
        const cost = parseInt(document.getElementById('reward').value);
        let db = getDb();
        if (!db[phone] || db[phone].points < cost) return alert("Poin kurang!");
        db[phone].points -= cost;
        db[phone].lastVisit = new Date().toISOString();
        saveDb(db);
        syncToSheet(phone, db[phone].name, db[phone].points, db[phone].dob);
        alert("Redeem Berhasil!");
    }

    window.onload = refreshDashboards;
</script>
</body>
</html>

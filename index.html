<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CRM Seblak Salah - Powered by Araya Consulting</title>
    <style>
        :root {
            --primary: #e67e22;
            --secondary: #2c3e50;
            --success: #27ae60;
            --wa: #25d366;
            --bg: #f4f7f6;
            --card: #ffffff;
        }
        body { font-family: 'Segoe UI', Roboto, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #333; }
        .container { max-width: 480px; margin: auto; }
        
        /* Branding Section */
        .branding { text-align: center; margin-bottom: 30px; }
        .branding img { max-width: 160px; height: auto; margin-bottom: 5px; }
        .branding h1 { font-size: 1.8rem; color: var(--primary); margin: 0; font-weight: 800; }
        .branding p { font-size: 0.85rem; color: #7f8c8d; margin: 2px 0; text-transform: uppercase; letter-spacing: 1px; }

        .card { background: var(--card); padding: 25px; border-radius: 24px; box-shadow: 0 15px 35px rgba(0,0,0,0.05); border: 1px solid #edf2f7; }
        
        .section-header { font-size: 0.75rem; font-weight: 800; color: #94a3b8; text-transform: uppercase; margin: 25px 0 12px 0; display: flex; align-items: center; letter-spacing: 0.5px; }
        .section-header::after { content: ""; flex: 1; height: 1px; background: #e2e8f0; margin-left: 15px; }

        label { font-size: 0.85rem; font-weight: 600; display: block; margin-bottom: 6px; color: #475569; }
        input, select { width: 100%; padding: 14px; margin-bottom: 15px; border: 2px solid #f1f5f9; border-radius: 14px; box-sizing: border-box; font-size: 1rem; transition: 0.3s; background: #f8fafc; }
        input:focus { border-color: var(--primary); outline: none; background: #fff; }

        .btn { width: 100%; padding: 16px; border: none; border-radius: 16px; font-weight: 700; cursor: pointer; font-size: 1rem; transition: 0.3s; margin-bottom: 12px; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .btn-check { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn-check:hover { background: #fff5eb; }
        .btn-save { background: var(--success); color: white; box-shadow: 0 4px 15px rgba(39, 174, 96, 0.2); }
        .btn-wa { background: var(--wa); color: white; box-shadow: 0 4px 15px rgba(37, 211, 102, 0.2); }
        .btn-redeem { background: var(--secondary); color: white; }
        .btn:active { transform: scale(0.97); }

        .result-box { margin-top: 20px; padding: 18px; border-radius: 18px; display: none; font-size: 0.95rem; line-height: 1.6; border-left: 6px solid; }
        .sync-status { font-size: 0.7rem; text-align: center; color: #94a3b8; margin-top: 10px; font-weight: 500; }
        
        .footer { text-align: center; margin-top: 40px; font-size: 0.75rem; color: #94a3b8; padding-top: 20px; border-top: 1px solid #e2e8f0; }
    </style>
</head>
<body>

<div class="container">
    <div class="branding">
        <img src="logo.png" alt="Araya Consulting">
        <h1>Seblak Salah</h1>
        <p>Loyalty Program Management</p>
    </div>

    <div class="card">
        <div class="section-header" style="margin-top:0;">Pelanggan</div>
        <input type="tel" id="phone" placeholder="Nomor WhatsApp (Contoh: 0812...)">
        <div style="display: flex; gap: 12px;">
            <button class="btn btn-check" onclick="cekPoin()">Cek Poin</button>
            <button class="btn btn-wa" onclick="bagikanWA()">Kirim WA</button>
        </div>

        <div class="section-header">Transaksi Baru</div>
        <label>Nama Pelanggan</label>
        <input type="text" id="name" placeholder="Nama Lengkap">
        <label>Total Belanja (Rp)</label>
        <input type="number" id="amount" placeholder="Input nominal transaksi">
        <button class="btn btn-save" onclick="tambahPoin()">Simpan & Update Cloud</button>

        <div class="section-header">Penukaran Reward</div>
        <select id="reward">
            <option value="10">Es Teh Manis (10 Pts)</option>
            <option value="20">Dimsum (20 Pts)</option>
            <option value="25">Seblak Lengkap (25 Pts)</option>
        </select>
        <button class="btn btn-redeem" onclick="redeemPoin()">Redeem Sekarang</button>

        <div id="output" class="result-box"></div>
        <div id="syncStatus" class="sync-status"></div>
    </div>

    <div class="footer">
        Powered by <strong>Araya Consulting</strong><br>
        Sistem Manajemen Loyalitas Modern &copy; 2026
    </div>
</div>

<script>
    const SPREADSHEET_URL = "https://script.google.com/macros/s/AKfycbwVO6-KVDvfFMcx6gMYF8u-C6JpSildSVPEDZ2N84IuWsvij_YRVtZhF-uz4SOYnx-i/exec"; 
    const STORAGE_KEY = 'seblaksalah_crm_v2';
    
    function getDb() { return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
    function saveDb(data) { localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); }

    function syncToSheet(phone, name, points) {
        document.getElementById('syncStatus').innerText = "🔄 Menghubungkan ke Cloud...";
        fetch(SPREADSHEET_URL, {
            method: 'POST', mode: 'no-cors',
            body: JSON.stringify({ phone: phone, name: name, points: points })
        }).then(() => {
            document.getElementById('syncStatus').innerText = "✅ Cloud Tersinkronisasi";
            setTimeout(() => { document.getElementById('syncStatus').innerText = ""; }, 3000);
        });
    }

    function showOutput(msg, type) {
        const out = document.getElementById('output');
        out.style.display = 'block';
        out.style.background = type === 'success' ? '#f0fdf4' : (type === 'info' ? '#f0f9ff' : '#fef2f2');
        out.style.color = type === 'success' ? '#166534' : (type === 'info' ? '#075985' : '#991b1b');
        out.style.borderColor = type === 'success' ? '#22c55e' : (type === 'info' ? '#0ea5e9' : '#ef4444');
        out.innerHTML = msg;
    }

    function cekPoin() {
        const phone = document.getElementById('phone').value;
        const db = getDb();
        if (!phone || !db[phone]) {
            showOutput("Nomor pelanggan belum terdaftar di database.", 'error');
            return;
        }
        
        const lastVisitStr = db[phone].lastVisit || new Date().toLocaleDateString('id-ID');
        const lastVisitDate = new Date(lastVisitStr.split('/').reverse().join('-'));
        const diffDays = Math.ceil(Math.abs(new Date() - lastVisitDate) / (1000 * 60 * 60 * 24));
        let warning = diffDays >= 7 ? `<br><span style="color:#ef4444; font-weight:bold;">⚠️ Sudah ${diffDays} hari tidak berkunjung</span>` : "";
        
        showOutput(`<strong>Member: ${db[phone].name}</strong><br>Saldo: ${db[phone].points} Pts<br>Visit Terakhir: ${lastVisitStr}${warning}`, 'info');
    }

    function tambahPoin() {
        const phone = document.getElementById('phone').value;
        let nameInput = document.getElementById('name').value;
        const amount = parseInt(document.getElementById('amount').value);
        if (!phone || isNaN(amount) || amount < 10000) return alert("Minimal belanja Rp10.000");

        const poinBaru = Math.floor(amount / 10000);
        let db = getDb();
        const dateStr = new Date().toLocaleDateString('id-ID');

        if (db[phone]) {
            db[phone].points += poinBaru;
            db[phone].lastVisit = dateStr;
            if(nameInput) db[phone].name = nameInput;
        } else {
            db[phone] = { name: nameInput || "Pelanggan", points: poinBaru, lastVisit: dateStr };
        }
        saveDb(db);
        syncToSheet(phone, db[phone].name, db[phone].points);
        showOutput(`<strong>Poin Berhasil Ditambah!</strong><br>Saldo Sekarang: ${db[phone].points} Pts`, 'success');
        document.getElementById('amount').value = "";
    }

    function bagikanWA() {
        const phone = document.getElementById('phone').value;
        const db = getDb();
        if (!phone || !db[phone]) return alert("Data tidak ditemukan!");

        const nama = db[phone].name;
        const poin = db[phone].points;
        const lastVisitStr = db[phone].lastVisit || new Date().toLocaleDateString('id-ID');
        const lastVisitDate = new Date(lastVisitStr.split('/').reverse().join('-'));
        const diffDays = Math.ceil(Math.abs(new Date() - lastVisitDate) / (1000 * 60 * 60 * 24));

        let katalog = `*Katalog Penukaran Poin:* \n🍹 10 Poin: Es Teh Manis \n🥟 20 Poin: Dimsum \n🍲 25 Poin: Seblak Lengkap`;
        let pesan = "";

        if (diffDays >= 7) {
            pesan = `Halo Kak ${nama}, kangen nih dari *Seblak Salah*! ✨\n\nSudah ${diffDays} hari Kakak tidak mampir. Saldo Kakak saat ini *${poin} Poin*. \n\n${katalog} \n\nYuk, mampir hari ini dan tukarkan poin Kakak!`;
        } else if (poin >= 25) {
            pesan = `Halo Kak ${nama}! 👋\n\nSelamat! Saldo Kakak *${poin} Poin*. Kakak bisa langsung tukar dengan *1 Porsi Seblak Lengkap*! 😍 \n\n${katalog} \n\nDitunggu di outlet ya!`;
        } else if (poin >= 20) {
            pesan = `Halo Kak ${nama}! 👋\n\nPoin Kakak sudah *${poin}*. Kakak sudah bisa tukar dengan *Dimsum* pilihan! 🥟 \n\n${katalog} \n\nYuk mampir hari ini!`;
        } else if (poin >= 10) {
            pesan = `Halo Kak ${nama}! 👋\n\nPoin Kakak sudah *${poin}*. Segarkan harimu dengan tukar *Es Teh Manis*! 🍹 \n\n${katalog} \n\nKumpulkan terus poinnya ya!`;
        } else {
            pesan = `Halo Kak ${nama}, terima kasih telah berkunjung ke *Seblak Salah*! \n\nSaldo Poin Kakak: *${poin} Pts*. \n\n${katalog} \n\nSetiap transaksi Rp10.000 = 1 Poin. Sampai jumpa kembali! 😊`;
        }

        const urlWA = `https://wa.me/${phone.replace(/^0/, '62')}?text=${encodeURIComponent(pesan)}`;
        window.open(urlWA, '_blank');
    }

    function redeemPoin() {
        const phone = document.getElementById('phone').value;
        const select = document.getElementById('reward');
        const cost = parseInt(select.value);
        let db = getDb();
        if (!db[phone] || db[phone].points < cost) return alert("Poin tidak cukup!");

        db[phone].points -= cost;
        saveDb(db);
        syncToSheet(phone, db[phone].name, db[phone].points);
        showOutput(`<strong>Redeem Berhasil!</strong><br>Sisa Saldo: ${db[phone].points} Pts`, 'success');
    }
</script>

</body>
</html>
